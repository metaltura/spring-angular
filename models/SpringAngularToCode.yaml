      - name: SpringAngularToProject
        instanceOf: Core:Class
        icon: mui:Layers
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:boot.Context
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: FileSystem:Entry
            code: |
              import { Folder, MarkdownFile, TextFile } from 'FileSystem'
              import { angularToCode } from 'SpringAngularToCode/angular'
              import { springToCode } from 'SpringAngularToCode/spring'

              /**
               * SpringAngularToProject — the stack pattern for Spring Boot +
               * Angular (rule 13, Q1). Branched on a Spring context, it writes a
               * single project in a system folder: a root (`README.md`,
               * `.gitignore`, the `docker-compose.yml` of the MariaDB database),
               * the server project under `server/` (ContextToProject, as is) and
               * the client project of the Angular frontend of the same application
               * under `client/` (FrontendToProject). No root package: each project
               * runs as an ordinary project of its stack. The folder stands alone
               * as a repository once copied.
               */
              export default function (source) {
                const context: any = source
                if (!context.application) {
                  throw new Error(`${context.name}: the context has no application`)
                }
                const frontend = frontendOf(context)
                const db = databaseNameOf(this, context)
                const textFile = (
                  name: string,
                  ext: string,
                  fileType: string,
                  lines: string[]
                ) => new TextFile({
                  name: this.fileNameOf(name, ext),
                  fileType,
                  text: this.textOf(lines)
                })
                return [
                  new MarkdownFile({
                    name: this.fileNameOf('README', 'md'),
                    text: this.textOf(readmeOf(context, frontend, db))
                  }),
                  textFile('', 'gitignore', 'plaintext',
                    ['target', 'node_modules', 'dist', '.angular']),
                  textFile('docker-compose', 'yml', 'yaml', composeOf(db)),
                  new Folder({
                    name: 'server',
                    entries: mapAll(context, springToCode)
                  }),
                  ...(frontend
                    ? [new Folder({
                        name: 'client',
                        entries: mapAll(frontend, angularToCode)
                      })]
                    : [])
                ]
              }

              /**
               * The Angular frontend of the application of the context: the first
               * one, with a warning when there are several or none.
               */
              function frontendOf(context: any): any {
                const frontends: any[] = (context.application.frontends ?? [])
                  .filter((f: any) => f.instanceOf?._inherits(e('Angular:Frontend')))
                const app = context.application.name
                if (frontends.length === 0) {
                  log.warning(`${context.name}: no Angular frontend in ${app}`)
                  return undefined
                }
                if (frontends.length > 1) {
                  const n = frontends.length
                  const first = frontends[0].name
                  log.warning(`${context.name}: ${n} Angular frontends, using ${first}`)
                }
                return frontends[0]
              }

              /**
               * The name of the database the server connects to, as
               * ContextToProject writes it in `application.properties`: the first
               * SQL database of the application, else the context in kebab-case.
               */
              function databaseNameOf(pattern: any, context: any): string {
                const stores: any[] = context.application.stores ?? []
                const database = stores.find((store: any) =>
                  store.instanceOf?._path?.() === 'Application:sql.Database')
                return database ? database.name : pattern.kebabOf(context.name)
              }

              /**
               * The lines of `docker-compose.yml`: MariaDB 11 on port 3306, the
               * database of the model, root without password as
               * `application.properties` expects, no volume — `docker compose down`
               * gives an empty database again.
               */
              function composeOf(db: string): string[] {
                return [
                  'services:',
                  '  mariadb:',
                  '    image: mariadb:11',
                  '    environment:',
                  `      MARIADB_DATABASE: ${db}`,
                  '      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"',
                  '    ports:',
                  '      - "3306:3306"'
                ]
              }

              /** The lines of the root `README.md`: how to run the whole. */
              function readmeOf(context: any, frontend: any, db: string) {
                const app = context.application
                const title = app.title || app.name
                const from = frontend
                  ? ` and the Angular frontend \`${frontend.name}\``
                  : ''
                return [
                  `# ${title} — Spring Boot + Angular`,
                  '',
                  `Generated from the Spring context \`${context.name}\`${from}`,
                  `of the application \`${app.name}\`. Regenerated at each change`,
                  'of the model: edit the model, not these files.',
                  '',
                  '- `server/` — the API: Spring Boot + JPA + MariaDB, built by Maven.',
                  ...(frontend
                    ? ['- `client/` — the user interface: Angular.']
                    : []),
                  '- `docker-compose.yml` — the MariaDB database.',
                  '',
                  '## Prerequisites',
                  '',
                  frontend
                    ? 'Java 17+, Maven 3.9, Docker with Compose, and Node 22.22.3+ or 24.15+.'
                    : 'Java 17+, Maven 3.9 and Docker with Compose.',
                  '',
                  '## Run',
                  '',
                  '1. `docker compose up -d` — MariaDB listens on',
                  `   \`localhost:3306\` with an empty database \`${db}\`.`,
                  '2. In `server/`: `mvn spring-boot:run` — the API listens on',
                  '   `http://localhost:8080` and creates the tables at start. A',
                  '   database just started may refuse the first connection: wait',
                  '   a few seconds and run it again.',
                  ...(frontend ? [
                    '3. In `client/`: `npm install` then `npm start` — the client',
                    '   opens on `http://localhost:4200` and calls the API through',
                    '   the dev server of Angular.'
                  ] : []),
                  '',
                  '`docker compose down` stops the database and removes it with its',
                  'data. After a field is added to the model, it is how the tables',
                  'are created again: `docker compose down` then',
                  '`docker compose up -d`.'
                ]
              }
