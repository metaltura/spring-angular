                '  background: #fdecea;',
                '}'
              ]

              /** The lines of `README.md`: how to run the client alone. */
              function readmeOf(
                pattern: any,
                frontend: any,
                basePaths: string[],
                apiUrl: string
              ): string[] {
                const services: any[] = frontend.services ?? []
                const forwarded = basePaths.map((p: string) => `\`${p}\``)
                return [
                  `# ${titleOf(frontend)} — Angular`,
                  '',
                  `Generated from the Angular frontend \`${frontend.name}\` of the application`,
                  `\`${frontend.application.name}\`. Regenerated at each change of the model: edit the`,
                  'model, not these files.',
                  '',
                  '## Run',
                  '',
                  `Node ${NODE} (the versions Angular ${ANGULAR} accepts).`,
                  '',
                  `1. The API server, listening on \`${apiUrl}\`.`,
                  '2. `npm install`',
                  '3. `npm start` — the client opens on `http://localhost:4200`; the dev',
                  `   server forwards ${forwarded.join(', ')} to the API server.`,
                  '',
                  '`npm run typecheck` checks the types, `npm run build` writes the',
                  'client under `dist/`.',
                  '',
                  '## Services',
                  '',
                  ...services.map((service: any) => {
                    const route = service.resource
                      ? pattern.routeOf(service.resource)
                      : '—'
                    const file = `src/app/api/${pattern.kebabOf(service.name)}.service.ts`
                    return `- \`${file}\` — \`${route}\``
                  })
                ]
              }
      - name: ServiceToFile
        instanceOf: Core:Class
        icon: mui:CloudSync
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Angular:Service
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:TypeScriptFile
            code: |
              import { TypeScriptFile } from 'FileSystem'

              /**
               * ServiceToFile — the service of an Angular frontend (rule 10), in
               * `src/app/api/`: an injectable class, a method per endpoint the
               * service serves, named after its operation (`list` · `get` ·
               * `create` · `update` · `remove`). Each one calls the HTTP client of
               * Angular on the route of the resource and the path of the endpoint
               * and returns an Observable of the payload; an HTTP error reaches
               * the component that subscribed. An endpoint of an unknown
               * operation, or a second one of the same operation, is skipped with
               * a warning.
               */
              export default function (source) {
                const service: any = source
                const resource: any = service.resource
                if (!resource) {
                  throw new Error(`${service.name}: the service has no resource`)
                }
                const endpoints = servedOf(this, service)
                const types = typesOf(this, endpoints)
                const typeFile = this.pascalOf(resource.name)
                const className = `${this.pascalOf(service.name)}Service`
                return new TypeScriptFile({
                  name: this.fileNameOf(`${this.kebabOf(service.name)}__service`, 'ts'),
                  text: this.textOf([
                    "import { HttpClient } from '@angular/common/http'",
                    "import { Injectable, inject } from '@angular/core'",
                    "import { Observable } from 'rxjs'",
                    ...(types.length > 0
                      ? [`import type { ${types.join(', ')} } from '../types/${typeFile}'`]
                      : []),
                    '',
                    `const route = '${this.routeOf(resource)}'`,
                    '',
                    "@Injectable({ providedIn: 'root' })",
                    `export class ${className} {`,
                    '  private readonly http = inject(HttpClient)',
                    ...endpoints.flatMap((endpoint: any) =>
                      ['', ...methodOf(this, endpoint)]),
                    '}'
                  ])
                })
              }

              /** The method of an operation: `delete` is a reserved word. */
              const METHOD_NAMES: Record<string, string> = {
                list: 'list',
                get: 'get',
                create: 'create',
                update: 'update',
                delete: 'remove'
              }

              /**
               * The endpoints the service serves: the first one of each known
               * operation, in the order of the model.
               */
              function servedOf(pattern: any, service: any): any[] {
                const seen = new Set<string>()
                const endpoints: any[] = service.endpoints ?? []
                return endpoints.filter((endpoint: any) => {
                  const operation = pattern.operationOf(endpoint)
                  if (operation === 'unknown') {
                    const what = `${endpoint.method} ${endpoint.path ?? ''}`
                    log.warning(`${service.name}: ${what} has no known operation, skipped`)
                    return false
                  }
                  if (seen.has(operation)) {
                    log.warning(`${service.name}: a second ${operation} endpoint, skipped`)
                    return false
                  }
                  seen.add(operation)
                  return true
                })
              }

              /** The payload types the methods name, once each. */
              function typesOf(pattern: any, endpoints: any[]): string[] {
                const names = endpoints
                  .flatMap((endpoint: any) => [endpoint.request, endpoint.response])
                  .filter((payload: any) => !!payload)
                  .map((payload: any) => pattern.pascalOf(payload.name))
                return names.filter((name: string, i: number) => names.indexOf(name) === i)
              }

              /** The path parameters of an endpoint, in their order. */
              function parametersOf(endpoint: any): string[] {
                const path = String(endpoint.path ?? '')
                return [...path.matchAll(/\{([^}]+)\}/g)].map((m: any) => m[1])
              }

              /**
               * The URL expression of an endpoint: the route of the resource,
               * then its path with each `{parameter}` encoded.
               */
              function urlOf(pattern: any, endpoint: any): string {
                const path = String(endpoint.path ?? '').replace(/\/+$/, '')
                if (path === '') return 'route'
                const filled = path.replace(/\{([^}]+)\}/g, (_: string, p: string) =>
                  `\${encodeURIComponent(${pattern.camelOf(p)})}`)
                return `\`\${route}${filled.startsWith('/') ? '' : '/'}${filled}\``
              }

              /** The type a method emits. */
              function resultOf(pattern: any, endpoint: any): string {
                if (!endpoint.response) return 'void'
                const type = pattern.pascalOf(endpoint.response.name)
                const many =
                  endpoint.returnsList || pattern.operationOf(endpoint) === 'list'
                return many ? `${type}[]` : type
              }

              /** The lines of the method of an endpoint. */
              function methodOf(pattern: any, endpoint: any): string[] {
                const name = METHOD_NAMES[pattern.operationOf(endpoint)]
                const params = parametersOf(endpoint)
                  .map((p: string) => `${pattern.camelOf(p)}: string`)
                const request = endpoint.request
                  ? pattern.pascalOf(endpoint.request.name)
                  : undefined
                if (request) params.push(`input: ${request}`)
                const verb = String(endpoint.method ?? 'GET').toLowerCase()
                const result = resultOf(pattern, endpoint)
                const args = [urlOf(pattern, endpoint)]
                if (request && verb !== 'get' && verb !== 'delete') args.push('input')
                return [
                  `  ${name}(${params.join(', ')}): Observable<${result}> {`,
                  `    return this.http.${verb}<${result}>(${args.join(', ')})`,
                  '  }'
                ]
              }
      - name: LayoutToFile
        instanceOf: Core:Class
        icon: mui:ViewQuilt
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Application:spa.Layout
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:TypeScriptFile
            code: |
              import { TypeScriptFile } from 'FileSystem'

              /**
               * LayoutToFile — the root component of an Angular frontend (rule 7),
               * `src/app/app.component.ts`: the navigation bar with the title and
               * the color of its Navbar child and a link per menu entry of the
               * frontend to the route of its page, the open page marked by the
               * `active` class, then the current page below (`<router-outlet />`).
               * No component library: HTML and the rules of `styles.css`.
               */
              export default function (source) {
                const layout: any = source
                const frontend: any = layout.frontend
                const children: any[] = layout.children ?? []
                const navbar = children.find((child: any) =>
                  child.instanceOf?._inherits(e('Application:spa.Navbar')))
                const links = linksOf(frontend?.menu ?? [])
                const uses = links.length > 0
                  ? ['RouterLink', 'RouterLinkActive', 'RouterOutlet']
                  : ['RouterOutlet']
                return new TypeScriptFile({
                  name: this.fileNameOf('app__component', 'ts'),
                  text: this.textOf([
                    "import { Component } from '@angular/core'",
                    `import { ${uses.join(', ')} } from '@angular/router'`,
                    '',
                    '@Component({',
                    "  selector: 'app-root',",
                    `  imports: [${uses.join(', ')}],`,
                    '  template: `',
                    ...navLines(navbar, links),
                    '    <main>',
                    '      <router-outlet />',
                    '    </main>',
                    '  `',
                    '})',
                    'export class AppComponent {}'
                  ])
                })
              }

              /**
               * A text in an Angular template: each character the template, HTML
               * or the template literal reads written as a character reference.
               */
              function htmlText(text: string): string {
                return String(text ?? '').replace(/[&<>"{}@`$\\]/g,
                  (c: string) => `&#${c.charCodeAt(0)};`)
              }

              /** The menu entries that lead to a page with a route. */
              function linksOf(menu: any[]): any[] {
                return menu.filter((entry: any) => {
                  if (entry.page?.route) return true
                  log.warning(`${entry.name}: the menu entry has no page route`)
                  return false
                })
              }

              /** The bar: its color, its title, a link per menu entry. */
              function navLines(navbar: any, links: any[]): string[] {
                const color = navbar?.color
                  ? ` style="background: ${htmlText(navbar.color)}"`
                  : ''
                return [
                  `    <nav${color}>`,
                  ...(navbar?.title
                    ? [`      <strong>${htmlText(navbar.title)}</strong>`]
                    : []),
                  ...links.map((entry: any) => {
                    const to = htmlText(entry.page.route)
                    const label = htmlText(entry.label ?? entry.name)
                    const attributes = `routerLink="${to}" routerLinkActive="active"`
                    return `      <a ${attributes}>${label}</a>`
                  }),
                  '    </nav>'
                ]
              }
      - name: PageComponentToFile
        instanceOf: Core:Class
        icon: mui:WebAsset
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Application:spa.PageComponent
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:TypeScriptFile
            code: |
              import { TypeScriptFile } from 'FileSystem'

              /**
               * PageComponentToFile — a page component of an Angular frontend
               * (rules 8, 9 and 12), in `src/app/pages/`: a standalone component
               * with an inline template, named after the page component
               * (`CommandeNewPage` gives `commande-new-page.component.ts` and
               * `CommandeNewPageComponent`). Its state is held in signals, the
               * change detection being zoneless. What it renders depends on its
               * child:
               * - a Table: a column per field of the page, a row per element that
               *   `list` returns, each row a link to its `rowLink` page, and a
               *   « New » link to the creation form of the resource;
               * - a Detail: the element `get` reads, a line per field, the links
               *   of the page and a « Delete » button when the service serves the
               *   deletion;
               * - a Form: a control per field driven by the template (`ngModel`),
               *   the validation of the browser kept (`ngNativeValidate`), filled
               *   by `get` when the route has an identifier, sent by `create` or
               *   `update`, then the detail.
               * A page whose service lacks the operation it needs shows « Not
               * available » and writes a warning. An error of the API shows in a
               * banner above the content: its status and its body.
               */
              export default function (source) {
                const component: any = source
                const page: any = component.page
                if (!page) {
                  throw new Error(`${component.name}: the page component has no page`)
                }
                const ctx = contextOf(this, component, page)
                const parts = !ctx.child
                  ? notAvailable(ctx, 'no table, detail or form')
                  : ctx.kind === 'table' ? tableOf(ctx)
                  : ctx.kind === 'detail' ? detailOf(ctx)
                  : formOf(ctx)
                return new TypeScriptFile({
                  name: this.fileNameOf(`${ctx.kebab}__component`, 'ts'),
                  text: this.textOf(fileLines(ctx, parts))
                })
              }

              /** Whether an element is an instance of a class or a subclass. */
              function isA(element: any, path: string): boolean {
                return !!element?.instanceOf?._inherits(e(path))
              }

              /** The kind of a child: `table`, `detail`, `form` or none. */
              function kindOf(child: any): string | undefined {
                if (isA(child, 'Application:spa.Table')) return 'table'
                if (isA(child, 'Application:spa.Detail')) return 'detail'
                if (isA(child, 'Application:spa.Form')) return 'form'
                return undefined
              }

              /**
               * The endpoints a service serves by operation: the first one of each
               * known operation, as ServiceToFile writes them.
               */
              function operationsOf(
                pattern: any,
                service: any
              ): Map<string, any> {
                const served = new Map<string, any>()
                for (const endpoint of service?.endpoints ?? []) {
                  const operation = pattern.operationOf(endpoint)
                  if (operation === 'unknown' || served.has(operation)) continue
                  served.set(operation, endpoint)
                }
                return served
              }

              /** The names of the parameters of a route (`:id` gives `id`). */
              function paramsOf(route: string): string[] {
                return [...String(route ?? '').matchAll(/:(\w+)/g)]
                  .map((m: any) => m[1])
              }

              /**
               * How a page component reaches a service: the name of its field,
               * its class and the file of the class.
               */
              function serviceRefOf(pattern: any, service: any): any {
                return {
                  field: pattern.camelOf(service.name),
                  type: `${pattern.pascalOf(service.name)}Service`,
                  file: `../api/${pattern.kebabOf(service.name)}.service`
                }
              }

              /**
               * What every rendering reads: the component, its page and frontend,
               * its child and its kind, the service of the resource and the
               * operations it serves, the payload type and the fields of the page
               * that the payload carries.
               */
              function contextOf(pattern: any, component: any, page: any): any {
                const frontend: any = component.frontend ?? page.frontend
                const child = (component.children ?? [])
                  .find((c: any) => kindOf(c) !== undefined)
                const payload: any = child?.payload
                const resource: any = page.resource ?? payload?.resource
                const service = pattern.apiClientOf(frontend, resource)
                const carried = new Map<string, any>((payload?.fields ?? [])
                  .map((f: any) => [pattern.camelOf(f.name), f]))
                const name = pattern.pascalOf(component.name)
                const fields = (page.fields ?? []).filter((field: any) => {
                  if (carried.has(pattern.camelOf(field.name))) return true
                  log.warning(`${name}: ${field.name} is not in the payload`)
                  return false
                })
                return {
                  pattern, component, page, frontend, child, payload, resource,
                  service, fields, carried, name,
                  kebab: pattern.kebabOf(component.name),
                  kind: kindOf(child),
                  ops: operationsOf(pattern, service),
                  ref: service ? serviceRefOf(pattern, service) : undefined,
                  type: payload ? pattern.pascalOf(payload.name) : undefined,
                  typeFile: resource ? pattern.pascalOf(resource.name) : undefined,
                  params: paramsOf(page.route)
                }
              }

              /**
               * A text in an Angular template: each character the template, HTML
               * or the template literal reads written as a character reference.
               */
              function htmlText(text: string): string {
                return String(text ?? '').replace(/[&<>"{}@`$\\]/g,
                  (c: string) => `&#${c.charCodeAt(0)};`)
              }

              /** The title of the page, as a template text. */
              function titleOf(ctx: any): string {
                return htmlText(ctx.page.title ?? ctx.page.name)
              }

              /**
               * The router commands of a route: its segments, a parameter given by
               * `valueOf` (`/commandes/:id/edit` and `item.id` give
               * `['/commandes', item.id, 'edit']`).
               */
              function commandsOf(
                route: string,
                valueOf: (p: string) => string
              ): string {
                const segments = String(route ?? '').split('/').filter(Boolean)
                const commands = segments.map((segment: string, i: number) => {
                  if (segment.startsWith(':')) return valueOf(segment.slice(1))
                  return `'${i === 0 ? '/' : ''}${segment}'`
                })
                if (segments.length === 0 || segments[0].startsWith(':')) {
                  commands.unshift("'/'")
                }
                return `[${commands.join(', ')}]`
              }

              /** The router link of an anchor: a path, or bound commands. */
              function linkOf(
                route: string,
                valueOf: (p: string) => string
              ): string {
                if (paramsOf(route).length === 0) {
                  return `routerLink="${htmlText(route)}"`
                }
                return `[routerLink]="${commandsOf(route, valueOf)}"`
              }

              /** The pages of the frontend for the resource of a context. */
              function siblingsOf(ctx: any, kind: string): any[] {
                const pages: any[] = ctx.frontend?.pages ?? []
                return pages.filter((page: any) =>
                  page.kind === kind && page.resource === ctx.resource)
              }

              /** The creation page: a form with no parameter. */
              function creationOf(ctx: any): any {
                return siblingsOf(ctx, 'form')
                  .find((page: any) => paramsOf(page.route).length === 0)
              }

              /**
               * The lines of the file: the imports, what the component uses, the
               * decorator with the inline template, then the class.
               */
              function fileLines(ctx: any, parts: any): string[] {
                const uses: string[] = parts.uses ?? []
                const before: string[] = parts.before ?? []
                return [
                  ...parts.imports,
                  ...(before.length > 0 ? ['', ...before] : []),
                  '',
                  '@Component({',
                  `  selector: 'app-${ctx.kebab}',`,
                  ...(uses.length > 0 ? [`  imports: [${uses.join(', ')}],`] : []),
                  '  template: `',
                  ...parts.template.map((line: string) => `    ${line}`),
                  '  `',
                  '})',
                  `export class ${ctx.name}Component {`,
                  ...(parts.members ?? []),
                  '}'
                ]
              }

              /** The parts of a page that cannot work, with a warning. */
              function notAvailable(ctx: any, why: string): any {
                log.warning(`${ctx.name}: ${why}, the page is not available`)
                return {
                  imports: ["import { Component } from '@angular/core'"],
                  template: [
                    '<section>',
                    `  <h1>${titleOf(ctx)}</h1>`,
                    '  <p>Not available</p>',
                    '</section>'
                  ]
                }
              }

              /**
               * The import lines of a page: `[module, names]` pairs, each name
               * once, a pair without name left out. A module whose names are all
               * types is imported with `import type`.
               */
              function importLines(
                modules: any[],
                types: any[] = []
              ): string[] {
                const line = (keyword: string) => ([from, names]: any) => {
                  const once = names
                    .filter((n: string, i: number) => names.indexOf(n) === i)
                  return `${keyword} { ${once.join(', ')} } from '${from}'`
                }
                return [
                  ...modules.filter(([, names]: any) => names.length > 0)
                    .map(line('import')),
                  ...types.filter(([, names]: any) => names.length > 0)
                    .map(line('import type'))
                ]
              }

              /** Each service once, in the order given. */
              function uniqueRefs(refs: any[]): any[] {
                return refs.filter((ref: any, i: number) =>
                  refs.findIndex((r: any) => r.type === ref.type) === i)
              }

              /** The import of each service once, in the order given. */
              function serviceImports(refs: any[]): any[] {
                return uniqueRefs(refs).map((ref: any) => [ref.file, [ref.type]])
              }

              /** The field that injects a service. */
              function injectLine(ref: any): string {
                return `  private readonly ${ref.field} = inject(${ref.type})`
              }

              /** The fields of the parameters of the route of the page. */
              function paramLines(ctx: any): string[] {
                return ctx.params.flatMap((p: string) => [
                  `  protected readonly ${p} =`,
                  `    this.route.snapshot.paramMap.get('${p}') ?? ''`
                ])
              }

              /**
               * The error the API sent: its signal, its banner above the content,
               * the method that sets it, and the function that writes its
               * message — its status and its body, as the React client shows it.
               */
              const ERROR_SIGNAL =
                '  protected readonly error = signal<string | undefined>(undefined)'
              const ERROR_BANNER = [
                '  @if (error()) {',
                '    <p class="error">{{ error() }}</p>',
                '  }'
              ]
              const FAIL = [
                '',
                '  private fail(error: HttpErrorResponse): void {',
                '    this.error.set(messageOf(error))',
                '  }'
              ]
              const MESSAGE_OF = [
                'function messageOf(error: HttpErrorResponse): string {',
                '  if (!error.status) return error.message',
                "  const body = typeof error.error === 'string'",
                '    ? error.error',
                '    : JSON.stringify(error.error)',
                '  return `${error.status} ${error.statusText}: ${body}`',
                '}'
              ]

              /** The lines that call the API and handle its answer. */
              function callLines(
                call: string,
                next: string,
                indent = 4
              ): string[] {
                const pad = ' '.repeat(indent)
                return [
                  `${pad}${call}.subscribe({`,
                  ...(next ? [`${pad}  next: ${next},`] : []),
                  `${pad}  error: (error: HttpErrorResponse) => this.fail(error)`,
                  `${pad}})`
                ]
              }

              /** Whether a field of the payload may be missing. */
              function nullableOf(ctx: any, field: any): boolean {
                const carried = ctx.carried.get(ctx.pattern.camelOf(field.name))
                return !carried?.mandatory
              }

              /**
               * The value of a field of `item` as a template expression: a date as
               * its day, a boolean as Yes or No, the values of a multiple field
               * joined. `nullable` tells whether it can be missing.
               */
              function expressionOf(ctx: any, field: any, item: string): any {
                const name = `${item}.${ctx.pattern.camelOf(field.name)}`
                const nullable = nullableOf(ctx, field)
                if (field.multiple) {
                  const all = nullable ? `(${name} ?? [])` : name
                  return { text: `${all}.join(', ')`, nullable: false }
                }
                if (field.widget === 'checkbox' || field.type?.name === 'Boolean') {
                  return { text: `${name} ? 'Yes' : 'No'`, nullable: false }
                }
                if (field.widget === 'date' || field.type?.name === 'Date') {
                  const day = `${name}${nullable ? '?.' : '.'}slice(0, 10)`
                  return { text: day, nullable }
                }
                return { text: name, nullable }
              }

              /** The parts of a list page (a Table). */
              function tableOf(ctx: any): any {
                if (!ctx.service) return notAvailable(ctx, 'no service')
                if (!ctx.ops.has('list')) return notAvailable(ctx, 'no list')
                const { pattern, fields, ref } = ctx
                const creation = creationOf(ctx)
                const rowLink: any = ctx.child.rowLink
                const key = (ctx.payload.fields ?? [])
                  .some((f: any) => pattern.camelOf(f.name) === 'id')
                const links = !!creation || !!rowLink?.route
                return {
                  imports: importLines([
                    ['@angular/common/http', ['HttpErrorResponse']],
                    ['@angular/core', ['Component', 'inject', 'signal']],
                    ['@angular/router', links ? ['RouterLink'] : []],
                    ...serviceImports([ref])
                  ], [[`../types/${ctx.typeFile}`, [ctx.type]]]),
                  before: MESSAGE_OF,
                  uses: links ? ['RouterLink'] : [],
                  template: [
                    '<section>',
                    `  <h1>${titleOf(ctx)}</h1>`,
                    ...(creation
                      ? [`  <a ${linkOf(creation.route, () => '')}>New</a>`]
                      : []),
                    ...ERROR_BANNER,
                    '  <table>',
                    '    <thead>',
                    '      <tr>',
                    ...fields.map((f: any) =>
                      `        <th>${htmlText(f.label ?? f.name)}</th>`),
                    '      </tr>',
                    '    </thead>',
                    '    <tbody>',
                    `      @for (item of items(); track ${key ? 'item.id' : '$index'}) {`,
                    '        <tr>',
                    ...fields.map((f: any, i: number) =>
                      cellLine(ctx, f, i === 0 ? rowLink : undefined)),
                    '        </tr>',
                    '      }',
                    '    </tbody>',
                    '  </table>',
                    '</section>'
                  ],
                  members: [
                    injectLine(ref),
                    `  protected readonly items = signal<${ctx.type}[]>([])`,
                    ERROR_SIGNAL,
                    '',
                    '  constructor() {',
                    ...callLines(`this.${ref.field}.list()`,
                      '(items) => this.items.set(items)'),
                    '  }',
                    ...FAIL
                  ]
                }
              }

              /**
               * The line of a cell. The first one links to the row page, and
               * shows a dash for a missing value so that the link stays visible.
               */
              function cellLine(ctx: any, field: any, rowLink: any): string {
                const value = expressionOf(ctx, field, 'item')
                if (!rowLink?.route) return `          <td>{{ ${value.text} }}</td>`
                const shown = value.nullable ? `${value.text} ?? '—'` : value.text
                const to = linkOf(rowLink.route, (p: string) =>
                  `item.${ctx.pattern.camelOf(p)}`)
                return `          <td><a ${to}>{{ ${shown} }}</a></td>`
              }

              /**
               * The links of a detail page to its linked pages, labelled by their
               * kind: List, Detail, Edit (a form with a parameter) or New.
               */
              function linkLines(ctx: any): string[] {
                const links: any[] = ctx.page.links ?? []
                return links.flatMap((page: any) => {
                  const missing = paramsOf(page.route)
                    .filter((p: string) => !ctx.params.includes(p))
                  if (missing.length > 0) {
                    log.warning(`${ctx.name}: no ${missing[0]} for ${page.name}`)
                    return []
                  }
                  const label = page.kind === 'list' ? 'List'
                    : page.kind === 'detail' ? 'Detail'
                    : paramsOf(page.route).length > 0 ? 'Edit' : 'New'
                  return [`    <a ${linkOf(page.route, (p: string) => p)}>${label}</a>`]
                })
              }

              /** The parts of a detail page (a Detail). */
              function detailOf(ctx: any): any {
                if (!ctx.service) return notAvailable(ctx, 'no service')
                if (!ctx.ops.has('get')) return notAvailable(ctx, 'no get')
                if (ctx.params.length === 0) {
                  return notAvailable(ctx, 'no identifier in the route')
                }
                const { ref } = ctx
                const canDelete = ctx.ops.has('delete')
                const list = siblingsOf(ctx, 'list')[0]
                const back = list ? commandsOf(list.route, (p) => `this.${p}`) : "['/']"
                const args = ctx.params.map((p: string) => `this.${p}`).join(', ')
                const links = linkLines(ctx)
                const router = ['ActivatedRoute',
                  ...(links.length > 0 ? ['RouterLink'] : []),
                  ...(canDelete ? ['Router'] : [])]
                return {
                  imports: importLines([
                    ['@angular/common/http', ['HttpErrorResponse']],
                    ['@angular/core', ['Component', 'inject', 'signal']],
                    ['@angular/router', router.sort()],
                    ...serviceImports([ref])
                  ], [[`../types/${ctx.typeFile}`, [ctx.type]]]),
                  before: MESSAGE_OF,
                  uses: links.length > 0 ? ['RouterLink'] : [],
                  template: [
                    '<section>',
                    `  <h1>${titleOf(ctx)}</h1>`,
                    ...ERROR_BANNER,
                    '  @if (item(); as item) {',
                    '    <dl>',
                    ...ctx.fields.flatMap((f: any) => [
                      `      <dt>${htmlText(f.label ?? f.name)}</dt>`,
                      `      <dd>{{ ${expressionOf(ctx, f, 'item').text} }}</dd>`
                    ]),
                    '    </dl>',
                    '  }',
                    '  <p>',
                    ...links,
                    ...(canDelete ? [
                      '    <button type="button" (click)="remove()">',
                      '      Delete',
                      '    </button>'
                    ] : []),
                    '  </p>',
                    '</section>'
                  ],
                  members: [
                    '  private readonly route = inject(ActivatedRoute)',
                    ...(canDelete ? ['  private readonly router = inject(Router)'] : []),
                    injectLine(ref),
                    ...paramLines(ctx),
                    `  protected readonly item = signal<${ctx.type} | undefined>(undefined)`,
                    ERROR_SIGNAL,
                    '',
                    '  constructor() {',
                    ...callLines(`this.${ref.field}.get(${args})`,
                      '(item) => this.item.set(item)'),
                    '  }',
                    ...(canDelete ? [
                      '',
                      '  protected remove(): void {',
                      ...callLines(`this.${ref.field}.remove(${args})`,
                        `() => void this.router.navigate(${back})`),
                      '  }'
                    ] : []),
                    ...FAIL
                  ]
                }
              }

              /**
               * How a field of a form is held and controlled: `checkbox` (a
               * boolean), `options` (a list of the elements of the resource of a
               * relation field), `enum` (the values of an Enum), `lines` (a
               * multiple field in a text area), `number` (a number input, its
               * value a number or null) or `input` (a text or a date).
               */
              function controlOf(ctx: any, field: any): any {
                const { pattern } = ctx
                const type: any = field.type
                const values = Array.isArray(type?.values) ? type.values : undefined
                if (field.widget === 'checkbox') return { kind: 'checkbox' }
                if (field.widget === 'select' && values) {
                  return { kind: 'enum', values }
                }
                if (field.widget === 'select' && field.resource) {
                  const service = pattern.apiClientOf(ctx.frontend, field.resource)
                  const list = operationsOf(pattern, service).get('list')
                  if (service && list?.response) {
                    return optionsOf(ctx, field, service, list.response)
                  }
                  log.warning(`${ctx.name}: no list for ${field.name}, a text input`)
                }
                if (field.multiple) return { kind: 'lines' }
                if (type?.name === 'Number') return { kind: 'number' }
                return { kind: 'input' }
              }

              /**
               * The control of a relation field: the service that lists the
               * elements of its resource, their type, the signal that holds them,
               * and the expression that labels one (rule 12).
               */
              function optionsOf(
                ctx: any,
                field: any,
                service: any,
                item: any
              ): any {
                const { pattern } = ctx
                const label = pattern.labelFieldOf(ctx.frontend, field.resource)
                const labelField = (item.fields ?? [])
                  .find((f: any) => pattern.camelOf(f.name) === label)
                const sure = label === 'id' || !!labelField?.mandatory
                return {
                  kind: 'options',
                  ref: serviceRefOf(pattern, service),
                  type: pattern.pascalOf(item.name),
                  typeFile: pattern.pascalOf(field.resource.name),
                  label: sure ? `option.${label}` : `option.${label} ?? option.id`,
                  state: pattern.camelOf(`${field.name} options`)
                }
              }

              /** The TypeScript type of the form value of a field. */
              function valueTypeOf(field: any, control: any): string {
                if (control.kind === 'checkbox') return 'boolean'
                if (control.kind === 'options' && field.multiple) return 'string[]'
                if (control.kind === 'number') return 'number | null'
                return 'string'
              }

              /** The empty form value of a field. */
              function emptyOf(field: any, control: any): string {
                if (control.kind === 'checkbox') return 'false'
                if (control.kind === 'options' && field.multiple) return '[]'
                if (control.kind === 'number') return 'null'
                return "''"
              }

              /** The form value of a field read from an element of the API. */
              function fromItem(ctx: any, field: any, control: any): string {
                const name = `item.${ctx.pattern.camelOf(field.name)}`
                if (control.kind === 'checkbox') return `Boolean(${name})`
                if (control.kind === 'options' && field.multiple) {
                  return `(${name} ?? []).map(String)`
                }
                if (control.kind === 'lines') return `(${name} ?? []).join('\\n')`
                if (control.kind === 'number') return `${name} ?? null`
                if (field.type?.name === 'Date') return `(${name} ?? '').slice(0, 10)`
                return `String(${name} ?? '')`
              }

              /**
               * The value sent to the API for a field: a number, a date at
               * midnight UTC, an array, nothing for an empty optional value.
               */
              function toInput(ctx: any, field: any, control: any): string {
                const v = `values.${ctx.pattern.camelOf(field.name)}`
                const number = field.type?.name === 'Number'
                const cast = control.kind === 'enum'
                  ? ` as ${ctx.type}['${ctx.pattern.camelOf(field.name)}']`
                  : ''
                if (control.kind === 'checkbox') return v
                if (field.multiple) {
                  const all = control.kind === 'options' ? v
                    : `${v}.split('\\n').map((s) => s.trim()).filter(Boolean)`
                  return `${all}${number ? '.map(Number)' : ''}${cast}`
                }
                if (control.kind === 'number') {
                  return field.mandatory ? `Number(${v})` : `${v} ?? undefined`
                }
                const one = field.type?.name === 'Date'
                  ? `\`\${${v}}T00:00:00.000Z\``
                  : v
                return field.mandatory
                  ? `${one}${cast}`
                  : `${v} === '' ? undefined : ${one}${cast}`
              }

              /** The lines of an element: its attributes one per line. */
              function tagLines(
                tag: string,
                attributes: string[],
                end: string
              ): string[] {
                return [
                  `      <${tag}`,
                  ...attributes.map((a: string) => `        ${a}`),
                  `      ${end}`
                ]
              }

              /**
               * The attributes that bind a control to the value of its field:
               * its name, the model and its change, `required` when it must.
               */
              function boundOf(name: string, required: boolean): string[] {
                return [
                  `name="${name}"`,
                  `[ngModel]="values().${name}"`,
                  `(ngModelChange)="change('${name}', $event)"`,
                  ...(required ? ['required'] : [])
                ]
              }

              /** The lines of the control of a field, in its label (rule 9). */
              function controlLines(
                ctx: any,
                field: any,
                control: any
              ): string[] {
                const name = ctx.pattern.camelOf(field.name)
                const label = htmlText(field.label ?? field.name)
                const required = !!field.mandatory && control.kind !== 'checkbox'
                const bound = boundOf(name, required)
                const type = control.kind === 'number' ? 'number'
                  : field.widget === 'date' || field.type?.name === 'Date' ? 'date'
                  : 'text'
                const body = control.kind === 'checkbox'
                  ? tagLines('input', ['type="checkbox"', ...bound], '/>')
                  : control.kind === 'lines' || field.widget === 'textarea'
                  ? tagLines('textarea', bound, '></textarea>')
                  : control.kind === 'enum' ? enumLines(control, bound)
                  : control.kind === 'options' ? optionLines(field, control, bound)
                  : tagLines('input', [`type="${type}"`,
                      ...(type === 'number' ? ['step="any"'] : []), ...bound], '/>')
                return ['    <label>', `      ${label}`, ...body, '    </label>']
              }

              /** The lines of a list of the values of an Enum. */
              function enumLines(control: any, bound: string[]): string[] {
                return [
                  ...tagLines('select', bound, '>'),
                  '        <option value="">—</option>',
                  ...control.values.map((value: string) =>
                    `        <option value="${htmlText(value)}">` +
                    `${htmlText(value)}</option>`),
                  '      </select>'
                ]
              }

              /** The lines of a list of the elements of a relation. */
              function optionLines(
                field: any,
                control: any,
                bound: string[]
              ): string[] {
                return [
                  ...tagLines('select', [...(field.multiple ? ['multiple'] : []),
                    ...bound], '>'),
                  ...(field.multiple ? [] : ['        <option value="">—</option>']),
                  `        @for (option of ${control.state}(); track option.id) {`,
                  '          <option [value]="option.id">',
                  `            {{ ${control.label} }}`,
                  '          </option>',
                  '        }',
                  '      </select>'
                ]
              }

              /** The parts of a form page (a Form). */
              function formOf(ctx: any): any {
                if (!ctx.service) return notAvailable(ctx, 'no service')
                const { pattern, ref } = ctx
                const operation = pattern.operationOf(ctx.child.endpoint)
                if (operation !== 'create' && operation !== 'update') {
                  return notAvailable(ctx, `a ${operation} endpoint`)
                }
                if (!ctx.ops.has(operation)) {
                  return notAvailable(ctx, `no ${operation}`)
                }
                if (operation === 'update' && ctx.params.length === 0) {
                  return notAvailable(ctx, 'no identifier for update')
                }
                const reads = ctx.params.length > 0 && ctx.ops.has('get')
                if (ctx.params.length > 0 && !reads) {
                  log.warning(`${ctx.name}: no get, the form starts empty`)
                }
                const controls = ctx.fields.map((f: any) => controlOf(ctx, f))
                const options = controls
                  .filter((c: any) => c.kind === 'options')
                  .filter((c: any, i: number, all: any[]) =>
                    all.findIndex((o: any) => o.state === c.state) === i)
                const item = reads ? ctx.ops.get('get').response : undefined
                const itemType = item ? pattern.pascalOf(item.name) : undefined
                const types = new Map<string, string[]>([[ctx.typeFile, [ctx.type]]])
                if (itemType) types.get(ctx.typeFile)!.push(itemType)
                for (const o of options) {
                  types.set(o.typeFile, [...(types.get(o.typeFile) ?? []), o.type])
                }
                const refs = [ref, ...options.map((o: any) => o.ref)]
                const after = afterOf(ctx, ctx.ops.get(operation))
                const router = [
                  ...(ctx.params.length > 0 ? ['ActivatedRoute'] : []),
                  ...(after ? ['Router'] : [])]
                return {
                  imports: importLines([
                    ['@angular/common/http', ['HttpErrorResponse']],
                    ['@angular/core', ['Component', 'inject', 'signal']],
                    ['@angular/forms', ['FormsModule']],
                    ['@angular/router', router],
                    ...serviceImports(refs)
                  ], [...types]
                    .map(([file, names]: any) => [`../types/${file}`, names])),
                  before: [
                    ...valuesLines(ctx, controls, itemType),
                    '',
                    ...MESSAGE_OF
                  ],
                  uses: ['FormsModule'],
                  template: [
                    '<section>',
                    `  <h1>${titleOf(ctx)}</h1>`,
                    ...ERROR_BANNER,
                    '  <form ngNativeValidate (ngSubmit)="submit()">',
                    ...ctx.fields.flatMap((f: any, i: number) =>
                      controlLines(ctx, f, controls[i])),
                    '    <button type="submit">Save</button>',
                    '  </form>',
                    '</section>'
                  ],
                  members: [
                    ...(ctx.params.length > 0
                      ? ['  private readonly route = inject(ActivatedRoute)']
                      : []),
                    ...(after ? ['  private readonly router = inject(Router)'] : []),
                    ...uniqueRefs(refs).map(injectLine),
                    ...paramLines(ctx),
                    '  protected readonly values = signal<Values>(EMPTY)',
                    ...options.map((o: any) =>
                      `  protected readonly ${o.state} = signal<${o.type}[]>([])`),
                    ERROR_SIGNAL,
                    '',
                    '  constructor() {',
                    ...options.flatMap((o: any) =>
                      callLines(`this.${o.ref.field}.list()`,
                        `(items) => this.${o.state}.set(items)`)),
                    ...(reads ? callLines(
                      `this.${ref.field}.get(${argsOf(ctx)})`,
                      '(item) => this.values.set(valuesOf(item))') : []),
                    '  }',
                    '',
                    '  protected change<K extends keyof Values>(',
                    '    name: K,',
                    '    value: Values[K]',
                    '  ): void {',
                    '    this.values.update((current) => ({ ...current, [name]: value }))',
                    '  }',
                    '',
                    '  protected submit(): void {',
                    ...callLines(sendOf(ctx, operation), after ?? ''),
                    '  }',
                    ...FAIL
                  ]
                }
              }

              /** The arguments of the route of the page, as fields. */
              function argsOf(ctx: any): string {
                return ctx.params.map((p: string) => `this.${p}`).join(', ')
              }

              /**
               * The declarations of a form before its component: the type of its
               * values, the empty values, the values of an element read from the
               * API, and the input sent from the values.
               */
              function valuesLines(
                ctx: any,
                controls: any[],
                itemType: any
              ): string[] {
                const { pattern, fields } = ctx
                const each = (write: (f: any, c: any) => string, pad: string) =>
                  fields.map((f: any, i: number) =>
                    `${pad}${pattern.camelOf(f.name)}: ${write(f, controls[i])}`)
                return [
                  'interface Values {',
                  ...each(valueTypeOf, '  '),
                  '}',
                  '',
                  'const EMPTY: Values = {',
                  ...withCommas(each(emptyOf, '  ')),
                  '}',
                  ...(itemType ? [
                    '',
                    `function valuesOf(item: ${itemType}): Values {`,
                    '  return {',
                    ...withCommas(each((f, c) => fromItem(ctx, f, c), '    ')),
                    '  }',
                    '}'
                  ] : []),
                  '',
                  `function inputOf(values: Values): ${ctx.type} {`,
                  '  return {',
                  ...withCommas(each((f, c) => toInput(ctx, f, c), '    ')),
                  '  }',
                  '}'
                ]
              }

              /** The lines of an object: a comma after each but the last. */
              function withCommas(lines: string[]): string[] {
                return lines.map((line: string, i: number) =>
                  i < lines.length - 1 ? `${line},` : line)
              }

              /**
               * Where a sent form goes, as the `next` of its call: the detail
               * page of the resource with the identifier of the element sent
               * back, else its list page. None: undefined, with a warning.
               */
              function afterOf(ctx: any, sent: any): string | undefined {
                const detail = siblingsOf(ctx, 'detail')[0]
                const list = siblingsOf(ctx, 'list')[0]
                const target = detail ?? list
                if (!target) {
                  log.warning(`${ctx.name}: no detail or list page to go to`)
                  return undefined
                }
                const fromResponse = !!sent?.response
                const commands = commandsOf(target.route, (p: string) =>
                  fromResponse ? `item.${ctx.pattern.camelOf(p)}` : `this.${p}`)
                const item = fromResponse ? '(item)' : '()'
                return `${item} => void this.router.navigate(${commands})`
              }

              /** The call that sends the form by `create` or `update`. */
              function sendOf(ctx: any, operation: string): string {
                const field = ctx.ref.field
                if (operation === 'create') {
                  return `this.${field}.create(inputOf(this.values()))`
                }
                const args = `${argsOf(ctx)}, inputOf(this.values())`
                return `this.${field}.update(${args})`
              }
