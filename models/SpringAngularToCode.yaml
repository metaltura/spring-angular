      - name: ContextToSchema
        instanceOf: Core:Class
        icon: mui:Storage
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:boot.Context
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:SqlFile
            code: |
              import { SqlFile } from 'FileSystem'

              /**
               * ContextToSchema — the schema of the SQL database of a Spring
               * application (rule 14), `src/main/resources/schema.sql`. Spring
               * plays it at start (`spring.sql.init.mode=always`) and Hibernate
               * checks the entities against it (`ddl-auto=validate`):
               * - a `CREATE TABLE IF NOT EXISTS` per table, a table after the
               *   tables its foreign keys reference (a reference to itself does
               *   not count, a cycle keeps the order of the model and warns);
               * - a column per column of the table, its SQL type as the model
               *   says, `NOT NULL` when it is mandatory;
               * - the primary key, then a foreign key per reference;
               * - each identifier between backquotes (`Order` is a reserved word).
               */
              export default function (source) {
                const context: any = source
                const database = databaseOf(context)
                const name = database ? ` ${database.name}` : ''
                const tables: any[] = database ? orderOf(database) : []
                return new SqlFile({
                  name: this.fileNameOf('schema', 'sql'),
                  text: this.textOf([
                    `-- The schema of the database${name}, generated from the model.`,
                    '-- Played by Spring at start, checked by Hibernate.',
                    ...tables.flatMap((table: any) => ['', ...tableLines(table)])
                  ])
                })
              }

              /** The SQL database of the application, the first one. */
              function databaseOf(context: any): any {
                const stores: any[] = context.application?.stores ?? []
                const sql = stores.filter((store: any) =>
                  store.instanceOf?._path?.() === 'Application:sql.Database')
                if (sql.length === 0) {
                  log.warning(`${context.name}: no SQL database, an empty schema`)
                }
                return sql[0]
              }

              /** The tables a table references, itself left out. */
              function targetsOf(table: any): any[] {
                const references: any[] = table.references ?? []
                return references
                  .map((reference: any) => reference.target)
                  .filter((target: any) => !!target && target !== table)
              }

              /**
               * The tables in the order they can be created: each time, the first
               * table of the model whose targets are all placed. When none is, a
               * cycle: the first table left, with a warning.
               */
              function orderOf(database: any): any[] {
                const left: any[] = [...(database.records ?? [])]
                const placed: any[] = []
                while (left.length > 0) {
                  let next = left.find((table: any) => targetsOf(table)
                    .every((t: any) => placed.includes(t) || !left.includes(t)))
                  if (!next) {
                    next = left[0]
                    log.warning(`${next.name}: a cycle of foreign keys, model order`)
                  }
                  placed.push(next)
                  left.splice(left.indexOf(next), 1)
                }
                return placed
              }

              /** An identifier between backquotes. */
              function quoted(name: string): string {
                return `\`${String(name).replace(/`/g, '``')}\``
              }

              /**
               * The SQL type of a column: the one of the model, else one from its
               * type with a warning.
               */
              function sqlTypeOf(table: any, column: any): string {
                if (column.sqlType) return column.sqlType
                const type = column.multiple ? 'JSON'
                  : column.type?.name === 'Number' ? 'DOUBLE'
                  : column.type?.name === 'Boolean' ? 'BOOLEAN'
                  : column.type?.name === 'Date' ? 'DATETIME(6)'
                  : 'VARCHAR(255)'
                log.warning(`${table.name}.${column.name}: no SQL type, ${type}`)
                return type
              }

              /** The lines of the creation of a table. */
              function tableLines(table: any): string[] {
                const columns: any[] = table.fields ?? []
                const references: any[] = table.references ?? []
                if (!table.key) log.warning(`${table.name}: no primary key`)
                const parts = [
                  ...columns.map((column: any) => {
                    const notNull = column.mandatory ? ' NOT NULL' : ''
                    const type = sqlTypeOf(table, column)
                    return `${quoted(column.name)} ${type}${notNull}`
                  }),
                  ...(table.key ? [`PRIMARY KEY (${quoted(table.key.name)})`] : []),
                  ...references.flatMap((reference: any) =>
                    foreignKeyOf(table, reference))
                ]
                return [
                  `CREATE TABLE IF NOT EXISTS ${quoted(table.name)} (`,
                  ...parts.map((part: string, i: number) =>
                    `  ${part}${i < parts.length - 1 ? ',' : ''}`),
                  ');'
                ]
              }

              /**
               * The foreign key of a reference: its column to the primary key of
               * its target. A reference without column or target key: none, with
               * a warning.
               */
              function foreignKeyOf(table: any, reference: any): string[] {
                const column = reference.column
                const key = reference.target?.key
                if (!column || !key) {
                  log.warning(`${table.name}.${reference.name}: no column or key`)
                  return []
                }
                const target = quoted(reference.target.name)
                return [`FOREIGN KEY (${quoted(column.name)}) ` +
                  `REFERENCES ${target} (${quoted(key.name)})`]
              }
      - name: contextToSchema
        instanceOf: SpringAngularToCode:spring.ContextToSchema
        source: Spring:boot.Context
        target: FileSystem:Folder
        outputRelation: FileSystem:EntryContainer.entries
  - name: angular
    instanceOf: Core:Package
    elements:
      - name: FrontendToProject
        instanceOf: Core:Class
        icon: thesvg:angular
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: apiUrl
            instanceOf: Core:PrimitiveProperty
            type: Core:String
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Angular:Frontend
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: FileSystem:Entry
            code: |
              import {
                CssFile,
                Folder,
                HtmlFile,
                MarkdownFile,
                TextFile,
                TypeScriptFile
              } from 'FileSystem'
              import {
                layoutToFile,
                pageComponentToFile,
                serviceToFile
              } from 'SpringAngularToCode/angular'
              import { resourceToPayloadTypes } from 'ApplicationToCode/code'

              /**
               * FrontendToProject — the head pattern of an Angular client (rules 2,
               * 5 and 6). Branched on an Angular frontend, it writes an Angular
               * project in a system folder, standalone components, zoneless:
               * - `package.json`, `angular.json` (the application builder, the dev
               *   server on port 4200 with the proxy), `tsconfig.json`,
               *   `tsconfig.app.json`, `proxy.conf.json` (the base path of each API
               *   forwarded to the option `apiUrl`), `.gitignore` and `README.md`;
               * - under `src/`: `index.html`, `main.ts`, `styles.css`, and under
               *   `src/app/`: `app.config.ts` (the router and the HTTP client),
               *   `app.routes.ts` (a route per route of the frontend), the root
               *   component (LayoutToFile), a file per page component
               *   (PageComponentToFile), a service per service of the frontend
               *   (ServiceToFile) and the types of the payloads of each resource
               *   they call (ResourceToPayloadTypes).
               * A page without page component, a route to a component of another
               * frontend or a service without resource is an error on the Mapping.
               */
              export default function (source) {
                const frontend: any = source
                if (!frontend.application) {
                  throw new Error(`${frontend.name}: the frontend has no application`)
                }
                const routes: any[] = frontend.routes ?? []
                routes.forEach((route: any) => checkRoute(frontend, route))
                const components: any[] = frontend.components ?? []
                const layout = components.find((c: any) =>
                  c.instanceOf?._inherits(e('Application:spa.Layout')))
                if (!layout) log.warning(`${frontend.name}: no layout`)
                const pageComponents = components.filter((c: any) =>
                  c.instanceOf?._inherits(e('Application:spa.PageComponent')))
                checkPages(frontend, pageComponents)
                const services: any[] = frontend.services ?? []
                const resources = services
                  .map((service: any) => service.resource)
                  .filter((r: any, i: number, all: any[]) => r && all.indexOf(r) === i)
                const apiUrl = this.apiUrl || 'http://localhost:8080'
                const basePaths = basePathsOf(frontend)
                const name = `${this.kebabOf(frontend.application.name)}-client`
                const textFile = (file: string, ext: string, type: string, lines: string[]) =>
                  new TextFile({
                    name: this.fileNameOf(file, ext),
                    fileType: type,
                    text: this.textOf(lines)
                  })
                const tsFile = (file: string, lines: string[]) =>
                  new TypeScriptFile({
                    name: this.fileNameOf(file, 'ts'),
                    text: this.textOf(lines)
                  })
                return [
                  textFile('package', 'json', 'json', packageOf(name)),
                  textFile('angular', 'json', 'json', angularJsonOf(name)),
                  textFile('tsconfig', 'json', 'json', TSCONFIG),
                  textFile('tsconfig__app', 'json', 'json', TSCONFIG_APP),
                  textFile('proxy__conf', 'json', 'json', proxyOf(basePaths, apiUrl)),
                  textFile('', 'gitignore', 'plaintext', ['node_modules', 'dist', '.angular']),
                  new MarkdownFile({
                    name: this.fileNameOf('README', 'md'),
                    text: this.textOf(readmeOf(this, frontend, basePaths, apiUrl))
                  }),
                  new Folder({
                    name: 'src',
                    entries: [
                      new HtmlFile({
                        name: this.fileNameOf('index', 'html'),
                        text: this.textOf(indexHtmlOf(frontend))
                      }),
                      tsFile('main', MAIN),
                      new CssFile({
                        name: this.fileNameOf('styles', 'css'),
                        text: this.textOf(STYLES)
                      }),
                      new Folder({
                        name: 'app',
                        entries: [
                          tsFile('app__config', APP_CONFIG),
                          tsFile('app__routes', routesOf(this, routes)),
                          layout ? map(layout, layoutToFile) : tsFile('app__component', ROOT_ALONE),
                          new Folder({
                            name: 'pages',
                            entries: pageComponents
                              .map((c: any) => map(c, pageComponentToFile))
                          }),
                          new Folder({
                            name: 'api',
                            entries: services.map((s: any) => map(s, serviceToFile))
                          }),
                          new Folder({
                            name: 'types',
                            entries: resources
                              .map((r: any) => map(r, resourceToPayloadTypes))
                          })
                        ]
                      })
                    ]
                  })
                ]
              }

              /**
               * A route leads to a page component of its own frontend (rule 4):
               * any other route is an error on the Mapping.
               */
              function checkRoute(frontend: any, route: any): void {
                const component = route.component
                if (!component) {
                  throw new Error(`${route.name}: the route has no component`)
                }
                if (component.frontend !== frontend) {
                  const owner = component.frontend?.name ?? 'no frontend'
                  throw new Error(
                    `${route.name}: ${component.name} belongs to ${owner}`)
                }
              }

              /**
               * Each page of the frontend has a page component (rule 4): a page
               * without one is an error on the Mapping.
               */
              function checkPages(frontend: any, pageComponents: any[]): void {
                const pages: any[] = frontend.pages ?? []
                for (const page of pages) {
                  if (pageComponents.some((c: any) => c.page === page)) continue
                  throw new Error(`${page.name}: the page has no page component`)
                }
              }

              /** The versions of Angular the project pins (rule 5). */
              const ANGULAR = '22.2.3'
              const ANGULAR_CLI = '22.2.4'
              const TYPESCRIPT = '6.0.2'
              const RXJS = '7.8.2'
              const NODE = '22.22.3+ or 24.15+'

              /** The lines of `package.json`, versions pinned (rule 5). */
              function packageOf(name: string): string[] {
                return [
                  '{',
                  `  "name": "${name}",`,
                  '  "version": "0.1.0",',
                  '  "private": true,',
                  '  "scripts": {',
                  '    "start": "ng serve",',
                  '    "build": "ng build",',
                  '    "typecheck": "tsc -p tsconfig.app.json --noEmit"',
                  '  },',
                  '  "dependencies": {',
                  `    "@angular/common": "${ANGULAR}",`,
                  `    "@angular/compiler": "${ANGULAR}",`,
                  `    "@angular/core": "${ANGULAR}",`,
                  `    "@angular/forms": "${ANGULAR}",`,
                  `    "@angular/platform-browser": "${ANGULAR}",`,
                  `    "@angular/router": "${ANGULAR}",`,
                  `    "rxjs": "${RXJS}"`,
                  '  },',
                  '  "devDependencies": {',
                  `    "@angular/build": "${ANGULAR_CLI}",`,
                  `    "@angular/cli": "${ANGULAR_CLI}",`,
                  `    "@angular/compiler-cli": "${ANGULAR}",`,
                  `    "typescript": "${TYPESCRIPT}"`,
                  '  }',
                  '}'
                ]
              }

              /**
               * The lines of `angular.json`: one project, the application builder,
               * the dev server on port 4200 with `proxy.conf.json`.
               */
              function angularJsonOf(name: string): string[] {
                return [
                  '{',
                  '  "$schema": "./node_modules/@angular/cli/lib/config/schema.json",',
                  '  "version": 1,',
                  '  "projects": {',
                  `    "${name}": {`,
                  '      "projectType": "application",',
                  '      "root": "",',
                  '      "sourceRoot": "src",',
                  '      "prefix": "app",',
                  '      "architect": {',
                  '        "build": {',
                  '          "builder": "@angular/build:application",',
                  '          "options": {',
                  '            "browser": "src/main.ts",',
                  '            "index": "src/index.html",',
                  '            "tsConfig": "tsconfig.app.json",',
                  '            "styles": ["src/styles.css"],',
                  '            "outputPath": "dist"',
                  '          }',
                  '        },',
                  '        "serve": {',
                  '          "builder": "@angular/build:dev-server",',
                  '          "options": {',
                  `            "buildTarget": "${name}:build",`,
                  '            "port": 4200,',
                  '            "proxyConfig": "proxy.conf.json"',
                  '          }',
                  '        }',
                  '      }',
                  '    }',
                  '  }',
                  '}'
                ]
              }

              /**
               * The lines of `tsconfig.json`: strict, modules kept for the bundler,
               * strict templates for the Angular compiler.
               */
              const TSCONFIG = [
                '{',
                '  "compilerOptions": {',
                '    "strict": true,',
                '    "target": "ES2022",',
                '    "module": "preserve",',
                '    "moduleResolution": "bundler",',
                '    "lib": ["ES2022", "DOM"],',
                '    "isolatedModules": true,',
                '    "skipLibCheck": true,',
                '    "noEmit": true',
                '  },',
                '  "angularCompilerOptions": {',
                '    "strictTemplates": true,',
                '    "strictInjectionParameters": true,',
                '    "strictInputAccessModifiers": true',
                '  }',
                '}'
              ]

              /** The lines of `tsconfig.app.json`: the app from `main.ts`. */
              const TSCONFIG_APP = [
                '{',
                '  "extends": "./tsconfig.json",',
                '  "compilerOptions": {',
                '    "types": []',
                '  },',
                '  "files": ["src/main.ts"],',
                '  "include": ["src/**/*.ts"]',
                '}'
              ]

              /**
               * The base paths the client calls: the base path of each API of the
               * application, once each, `/api` when none says.
               */
              function basePathsOf(frontend: any): string[] {
                const apis: any[] = frontend.application.apis ?? []
                const paths = apis
                  .map((api: any) => String(api.basePath ?? '').replace(/\/+$/, ''))
                  .filter((p: string, i: number, all: string[]) =>
                    p !== '' && all.indexOf(p) === i)
                if (paths.length === 0) {
                  log.warning(`${frontend.name}: no API base path, /api proxied`)
                  return ['/api']
                }
                return paths
              }

              /**
               * The lines of `proxy.conf.json`: each base path of the API forwarded
               * to `apiUrl` by the dev server, so the client calls it without CORS.
               */
              function proxyOf(basePaths: string[], apiUrl: string): string[] {
                return [
                  '{',
                  ...basePaths.flatMap((path: string, i: number, all: string[]) => [
                    `  "${path}": {`,
                    `    "target": "${apiUrl}",`,
                    '    "secure": false',
                    `  }${i < all.length - 1 ? ',' : ''}`
                  ]),
                  '}'
                ]
              }

              /** The title of the application: its title, else its name. */
              function titleOf(frontend: any): string {
                return frontend.application.title || frontend.application.name
              }

              /**
               * The lines of `index.html`: the base of the URLs the router and the
               * bundles resolve, the root element.
               */
              function indexHtmlOf(frontend: any): string[] {
                return [
                  '<!doctype html>',
                  '<html lang="en">',
                  '  <head>',
                  '    <meta charset="UTF-8" />',
                  '    <meta name="viewport" content="width=device-width, initial-scale=1.0" />',
                  `    <title>${titleOf(frontend)}</title>`,
                  '    <base href="/" />',
                  '  </head>',
                  '  <body>',
                  '    <app-root></app-root>',
                  '  </body>',
                  '</html>'
                ]
              }

              /** The lines of `src/main.ts`: the root component started. */
              const MAIN = [
                "import { bootstrapApplication } from '@angular/platform-browser'",
                "import { AppComponent } from './app/app.component'",
                "import { appConfig } from './app/app.config'",
                '',
                'bootstrapApplication(AppComponent, appConfig)',
                '  .catch((error) => console.error(error))'
              ]

              /**
               * The lines of `src/app/app.config.ts`: zoneless change detection,
               * the router with the routes of the frontend, the HTTP client.
               */
              const APP_CONFIG = [
                "import { provideHttpClient } from '@angular/common/http'",
                'import {',
                '  ApplicationConfig,',
                '  provideZonelessChangeDetection',
                "} from '@angular/core'",
                "import { provideRouter } from '@angular/router'",
                "import { routes } from './app.routes'",
                '',
                'export const appConfig: ApplicationConfig = {',
                '  providers: [',
                '    provideZonelessChangeDetection(),',
                '    provideRouter(routes),',
                '    provideHttpClient()',
                '  ]',
                '}'
              ]

              /** The root component without layout: the outlet alone. */
              const ROOT_ALONE = [
                "import { Component } from '@angular/core'",
                "import { RouterOutlet } from '@angular/router'",
                '',
                '@Component({',
                "  selector: 'app-root',",
                '  imports: [RouterOutlet],',
                '  template: `<router-outlet />`',
                '})',
                'export class AppComponent {}'
              ]

              /**
               * The routes in the order the router of Angular must try them: it
               * takes the first one that matches, so a path with fewer parameters
               * comes first (`commandes/new` before `commandes/:id`), the order of
               * the model kept otherwise.
               */
              function byMatch(routes: any[]): any[] {
                const params = (route: any) =>
                  (String(route.path ?? '').match(/:\w+/g) ?? []).length
                return routes
                  .map((route: any, i: number) => ({ route, i }))
                  .sort((a: any, b: any) =>
                    params(a.route) - params(b.route) || a.i - b.i)
                  .map(({ route }: any) => route)
              }

              /**
               * The lines of `src/app/app.routes.ts`: a route per route of the
               * frontend, its path as the model says without the leading slash,
               * its page component imported from `./pages/`, the routes in the
               * order the router tries them (`byMatch`).
               */
              function routesOf(pattern: any, model: any[]): string[] {
                const routes = byMatch(model)
                const names = routes
                  .map((route: any) => route.component.name)
                  .filter((c: string, i: number, all: string[]) => all.indexOf(c) === i)
                return [
                  "import { Routes } from '@angular/router'",
                  ...names.map((c: string) => {
                    const file = `./pages/${pattern.kebabOf(c)}.component`
                    return `import { ${pattern.pascalOf(c)}Component } from '${file}'`
                  }),
                  '',
                  'export const routes: Routes = [',
                  ...routes.map((route: any, i: number) => {
                    const path = String(route.path ?? '').replace(/^\/+/, '')
                    const c = `${pattern.pascalOf(route.component.name)}Component`
                    const comma = i < routes.length - 1 ? ',' : ''
                    return `  { path: '${path}', component: ${c} }${comma}`
                  }),
