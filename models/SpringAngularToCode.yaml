name: SpringAngularToCode
instanceOf: Core:Model
elements:
  - name: spring
    instanceOf: Core:Package
    elements:
      - name: SpringPattern
        instanceOf: Core:Class
        abstract: true
        icon: mui:Code
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: keyTypeOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: entity
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:jpa.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * The Java type of the key of a JPA entity: `Long` for an IDENTITY
               * key, otherwise the type of the column of its `id` (rule 11).
               */
              export default function (entity: any) {
                if (entity.idGeneration === 'IDENTITY') return 'Long'
                const column = entity.id?.column
                return column ? this.javaTypeOf(column) : 'String'
              }
          - name: controllersOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: service
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:service.Service
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Spring:web.Controller
            code: |
              /**
               * The controllers of the context that call a service, in the order
               * of the context.
               */
              export default function (service: any) {
                const beans: any[] = service.context?.beans ?? []
                return beans.filter((bean: any) =>
                  bean.instanceOf?.name === 'Controller' && bean.service === service)
              }
          - name: repositoryOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: controller
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:web.Controller
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: false
              type: Spring:jpa.Repository
            code: |
              /**
               * The repository a controller works with (rule 23): among the
               * repositories of its service, the one whose JPA entity is bound to
               * the table named as the resource of the controller. None: undefined.
               */
              export default function (controller: any) {
                const resource = controller.resource?.name
                const repositories: any[] = controller.service?.repositories ?? []
                return repositories.find((repository: any) =>
                  repository.entity?.table?.name === resource)
              }
          - name: servedOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: controller
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:web.Controller
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Application:http.Endpoint
            code: |
              /**
               * The endpoints of a controller its service implements (rules 10, 21
               * and 23): the first endpoint of each known operation, when the
               * service has the repository of the resource and the endpoint has
               * the payloads its operation needs — a response to list, read,
               * create or update, a request to create or update. The controller
               * answers 501 to the others.
               */
              export default function (controller: any) {
                if (!this.repositoryOf(controller)) return []
                const seen = new Set<string>()
                const endpoints: any[] = controller.endpoints ?? []
                return endpoints.filter((endpoint: any) => {
                  const operation = this.operationOf(endpoint)
                  if (operation === 'unknown' || seen.has(operation)) return false
                  const writes = operation === 'create' || operation === 'update'
                  if (operation !== 'delete' && !endpoint.response) return false
                  if (writes && !endpoint.request) return false
                  seen.add(operation)
                  return true
                })
              }
          - name: serviceMethodOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: controller
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:web.Controller
              - name: operation
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:String
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * The name of the service method a controller calls for an operation
               * (rule 21): `list`, `get`, `create`, `update` or `delete`, followed
               * by the resource when the service serves several resources
               * (`listCommande`).
               */
              export default function (controller: any, operation) {
                const controllers: any[] = this.controllersOf(controller.service)
                const resources = new Set(controllers.map((c: any) => c.resource))
                if (resources.size <= 1) return operation
                return `${operation}${this.pascalOf(controller.resource.name)}`
              }
      - name: ContextToProject
        instanceOf: Core:Class
        icon: thesvg:spring-boot
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:boot.Context
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: FileSystem:Entry
            code: |
              import {
                Folder,
                JavaFile,
                MarkdownFile,
                TextFile
              } from 'FileSystem'
              import {
                contextToSchema,
                controllerToDtos,
                controllerToJavaFile,
                entityToJavaFile,
                repositoryToJavaFile,
                serviceToJavaFile
              } from 'SpringAngularToCode/spring'

              /**
               * ContextToProject — the stack pattern for Spring Boot (rules 16 and
               * 17). Branched on a Spring context, it writes the Maven project in a
               * system folder:
               * - `pom.xml`, `README.md`, and under `src/main/resources/`:
               *   `application.properties` and `schema.sql` (ContextToSchema), the
               *   schema Spring plays at start and Hibernate validates (rule 14);
               * - under `src/main/java/<base package>/`: the application class, in
               *   `config/` the handler of the errors of the API (rule 15) and the
               *   JSON written as the Node server writes it (rule 22), a
               *   JPA entity per entity of the context (EntityToJavaFile), an
               *   interface per repository (RepositoryToJavaFile), a class per
               *   service (ServiceToJavaFile) and per controller
               *   (ControllerToJavaFile), and a transfer record per payload its
               *   controllers serve (ControllerToDtos).
               */
              export default function (source) {
                const context: any = source
                if (!context.application) {
                  throw new Error(`${context.name}: the context has no application`)
                }
                const appClass = `${this.pascalOf(context.name)}Application`
                const entityFiles = (context.entities ?? [])
                  .map((entity: any) => map(entity, entityToJavaFile))
                const repositories = beansOf(context, 'Repository')
                const services = beansOf(context, 'Service')
                const controllers = beansOf(context, 'Controller')
                const dtoFiles = firstOfEachName(
                  controllers.flatMap((controller: any) => mapAll(controller, controllerToDtos))
                )
                const folderOf = (name: string, entries: any[]) =>
                  new Folder({ name, entries })
                const javaRoot = nest(String(context.basePackage).split('.'), [
                  new JavaFile({
                    name: this.fileNameOf(appClass, 'java'),
                    text: this.textOf(applicationClassOf(context, appClass))
                  }),
                  folderOf('config', [
                    new JavaFile({
                      name: this.fileNameOf('ApiExceptionHandler', 'java'),
                      text: this.textOf(exceptionHandlerOf(context))
                    }),
                    new JavaFile({
                      name: this.fileNameOf('JsonConfig', 'java'),
                      text: this.textOf(jsonConfigOf(context))
                    })
                  ]),
                  folderOf('entity', entityFiles),
                  folderOf('repository', repositories
                    .map((bean: any) => map(bean, repositoryToJavaFile))),
                  folderOf('service', services
                    .map((bean: any) => map(bean, serviceToJavaFile))),
                  folderOf('web', controllers
                    .map((bean: any) => map(bean, controllerToJavaFile))),
                  folderOf('dto', dtoFiles)
                ])
                return [
                  new TextFile({
                    name: this.fileNameOf('pom', 'xml'),
                    fileType: 'xml',
                    text: this.textOf(pomOf(this, context))
                  }),
                  new MarkdownFile({
                    name: this.fileNameOf('README', 'md'),
                    text: this.textOf(readmeOf(this, context))
                  }),
                  new Folder({
                    name: 'src',
                    entries: [
                      new Folder({
                        name: 'main',
                        entries: [
                          new Folder({
                            name: 'resources',
                            entries: [
                              new TextFile({
                                name: this.fileNameOf('application', 'properties'),
                                fileType: 'properties',
                                text: this.textOf(propertiesOf(this, context))
                              }),
                              map(context, contextToSchema)
                            ]
                          }),
                          new Folder({ name: 'java', entries: [javaRoot] })
                        ]
                      })
                    ]
                  })
                ]
              }

              /**
               * Nested folders for a package path, the entries in the innermost.
               */
              function nest(names: string[], entries: any[]): any {
                const [name, ...rest] = names
                return new Folder({
                  name,
                  entries: rest.length ? [nest(rest, entries)] : entries
                })
              }

              /**
               * The beans of a context of one kind (`Repository`, `Service`,
               * `Controller`), in the order of the context.
               */
              function beansOf(context: any, kind: string): any[] {
                const beans: any[] = context.beans ?? []
                return beans.filter((bean: any) => bean.instanceOf?.name === kind)
              }

              /**
               * Two controllers on the same resource give the same records: once.
               */
              function firstOfEachName(specs: any[]): any[] {
                const seen = new Set<string>()
                return specs.filter((spec: any) => {
                  if (seen.has(spec.name)) return false
                  seen.add(spec.name)
                  return true
                })
              }

              /**
               * The SQL database of the application, the first one (rule 16).
               */
              function databaseOf(pattern: any, context: any): any {
                const stores: any[] = context.application.stores ?? []
                const sql = stores.filter((s: any) => s.instanceOf?._path?.() === 'Application:sql.Database')
                if (sql.length === 0) {
                  log.warning(`${context.name}: no SQL database in ${context.application.name}`)
                  return undefined
                }
                if (sql.length > 1) {
                  log.warning(`${context.name}: ${sql.length} SQL databases, using ${sql[0].name}`)
                }
                return sql[0]
              }

              /** The lines of `pom.xml`. */
              function pomOf(pattern: any, context: any): string[] {
                const artifact = pattern.kebabOf(context.name)
                const dependency = (artifactId: string, scope?: string) => [
                  '    <dependency>',
                  `      <groupId>${artifactId.startsWith('spring-boot') ? 'org.springframework.boot' : 'org.mariadb.jdbc'}</groupId>`,
                  `      <artifactId>${artifactId}</artifactId>`,
                  ...(scope ? [`      <scope>${scope}</scope>`] : []),
                  '    </dependency>'
                ]
                return [
                  '<?xml version="1.0" encoding="UTF-8"?>',
                  '<project xmlns="http://maven.apache.org/POM/4.0.0"',
                  '         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"',
                  '         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">',
                  '  <modelVersion>4.0.0</modelVersion>',
                  '  <parent>',
                  '    <groupId>org.springframework.boot</groupId>',
                  '    <artifactId>spring-boot-starter-parent</artifactId>',
                  '    <version>3.3.5</version>',
                  '    <relativePath/>',
                  '  </parent>',
                  `  <groupId>${context.basePackage}</groupId>`,
                  `  <artifactId>${artifact}</artifactId>`,
                  '  <version>0.1.0</version>',
                  `  <name>${artifact}</name>`,
                  '  <properties>',
                  '    <java.version>17</java.version>',
                  '  </properties>',
                  '  <dependencies>',
                  ...dependency('spring-boot-starter-web'),
                  ...dependency('spring-boot-starter-data-jpa'),
                  ...dependency('spring-boot-starter-validation'),
                  ...dependency('mariadb-java-client', 'runtime'),
                  '  </dependencies>',
                  '  <build>',
                  '    <plugins>',
                  '      <plugin>',
                  '        <groupId>org.springframework.boot</groupId>',
                  '        <artifactId>spring-boot-maven-plugin</artifactId>',
                  '      </plugin>',
                  '    </plugins>',
                  '  </build>',
                  '</project>'
                ]
              }

              /**
               * The lines of `application.properties`: the server, the database,
               * `schema.sql` played at start and checked by Hibernate (rule 14),
               * the names of the tables and columns used as the entities write
               * them, as `schema.sql` does (Spring Boot would turn `clientId` into
               * `client_id`).
               */
              function propertiesOf(pattern: any, context: any): string[] {
                const database = databaseOf(pattern, context)
                const name = database ? database.name : pattern.kebabOf(context.name)
                return [
                  `spring.application.name=${pattern.kebabOf(context.name)}`,
                  'server.port=8080',
                  `spring.datasource.url=jdbc:mariadb://localhost:3306/${name}`,
                  'spring.datasource.username=' + '${DB_USER:root}',
                  'spring.datasource.password=' + '${DB_PASSWORD:}',
                  'spring.sql.init.mode=always',
                  'spring.jpa.hibernate.ddl-auto=validate',
                  'spring.jpa.hibernate.naming.physical-strategy=' +
                    'org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl',
                  'spring.jpa.open-in-view=false'
                ]
              }

              /**
               * The lines of `config/JsonConfig.java` (rule 22): the JSON of the
               * API written as the Node server writes it — a date in ISO 8601
               * with its milliseconds in UTC, a missing value left out rather
               * than `null`, a whole number without a decimal part (`2`, not
               * `2.0`).
               */
              function jsonConfigOf(context: any): string[] {
                return [
                  `package ${context.basePackage}.config;`,
                  '',
                  'import com.fasterxml.jackson.annotation.JsonInclude;',
                  'import com.fasterxml.jackson.core.JsonGenerator;',
                  'import com.fasterxml.jackson.databind.JsonSerializer;',
                  'import com.fasterxml.jackson.databind.SerializerProvider;',
                  'import java.io.IOException;',
                  'import java.time.Instant;',
                  'import java.time.ZoneOffset;',
                  'import java.time.format.DateTimeFormatter;',
                  'import org.springframework.boot.autoconfigure.jackson.Jackson2ObjectMapperBuilderCustomizer;',
                  'import org.springframework.context.annotation.Bean;',
                  'import org.springframework.context.annotation.Configuration;',
                  '',
                  '@Configuration',
                  'public class JsonConfig {',
                  '',
                  '    private static final DateTimeFormatter ISO_MILLIS = DateTimeFormatter',
                  '        .ofPattern("yyyy-MM-dd\'T\'HH:mm:ss.SSS\'Z\'")',
                  '        .withZone(ZoneOffset.UTC);',
                  '',
                  '    @Bean',
                  '    public Jackson2ObjectMapperBuilderCustomizer asTheNodeServer() {',
                  '        return builder -> builder',
                  '            .serializationInclusion(JsonInclude.Include.NON_NULL)',
                  '            .serializerByType(Instant.class, new InstantSerializer())',
                  '            .serializerByType(Double.class, new DoubleSerializer());',
                  '    }',
                  '',
                  '    private static class InstantSerializer extends JsonSerializer<Instant> {',
                  '        @Override',
                  '        public void serialize(Instant value, JsonGenerator json,',
                  '                SerializerProvider provider) throws IOException {',
                  '            json.writeString(ISO_MILLIS.format(value));',
                  '        }',
                  '    }',
                  '',
                  '    private static class DoubleSerializer extends JsonSerializer<Double> {',
                  '        @Override',
                  '        public void serialize(Double value, JsonGenerator json,',
                  '                SerializerProvider provider) throws IOException {',
                  '            boolean whole = value == Math.rint(value)',
                  '                && Math.abs(value) < 9007199254740992d;',
                  '            if (whole) {',
                  '                json.writeNumber(value.longValue());',
                  '            } else {',
                  '                json.writeNumber(value);',
                  '            }',
                  '        }',
                  '    }',
                  '}'
                ]
              }

              /**
               * The lines of `config/ApiExceptionHandler.java` (rule 15): the
               * errors answered as the Node server does. A payload that fails its
               * validation gives 400 and `errors` with a reason per field
               * (`required` for a missing value), in the order the payload
               * declares its fields — the validator reports them in no stable
               * order. A deletion the database refuses
               * because a foreign key references the element gives 409 and
               * `errors` with `id: referenced`; any other refusal of the database
               * gives 409 and the message of its cause. A value of the wrong type
               * gives 400 and `errors` with the kind the Node server names
               * (`date`, `Number`).
               */
              function exceptionHandlerOf(context: any): string[] {
                return [
                  `package ${context.basePackage}.config;`,
                  '',
                  'import jakarta.servlet.http.HttpServletRequest;',
                  'import com.fasterxml.jackson.databind.exc.MismatchedInputException;',
                  'import java.lang.reflect.RecordComponent;',
                  'import java.time.temporal.Temporal;',
                  'import java.util.LinkedHashMap;',
                  'import java.util.List;',
                  'import java.util.Map;',
                  'import java.util.stream.Stream;',
                  'import org.springframework.core.NestedExceptionUtils;',
                  'import org.springframework.dao.DataIntegrityViolationException;',
                  'import org.springframework.http.HttpStatus;',
                  'import org.springframework.http.ResponseEntity;',
                  'import org.springframework.http.converter.HttpMessageNotReadableException;',
                  'import org.springframework.validation.FieldError;',
                  'import org.springframework.web.bind.MethodArgumentNotValidException;',
                  'import org.springframework.web.bind.annotation.ExceptionHandler;',
                  'import org.springframework.web.bind.annotation.RestControllerAdvice;',
                  '',
                  '@RestControllerAdvice',
                  'public class ApiExceptionHandler {',
                  '',
                  '    @ExceptionHandler(MethodArgumentNotValidException.class)',
                  '    public ResponseEntity<Map<String, Object>> invalid(',
                  '            MethodArgumentNotValidException exception) {',
                  '        Map<String, String> errors = new LinkedHashMap<>();',
                  '        for (String field : fieldsOf(exception.getTarget())) {',
                  '            FieldError error = exception.getFieldError(field);',
                  '            if (error != null) {',
                  '                errors.put(field, reasonOf(error));',
                  '            }',
                  '        }',
                  '        for (FieldError error : exception.getFieldErrors()) {',
                  '            errors.putIfAbsent(error.getField(), reasonOf(error));',
                  '        }',
                  '        return ResponseEntity.badRequest().body(Map.of("errors", errors));',
                  '    }',
                  '',
                  '    @ExceptionHandler(HttpMessageNotReadableException.class)',
                  '    public ResponseEntity<Map<String, Object>> unreadable(',
                  '            HttpMessageNotReadableException exception) {',
                  '        if (exception.getCause() instanceof MismatchedInputException input',
                  '                && !input.getPath().isEmpty()) {',
                  '            String field = input.getPath()',
                  '                .get(input.getPath().size() - 1).getFieldName();',
                  '            return ResponseEntity.badRequest().body(Map.of("errors",',
                  '                Map.of(field, kindOf(input.getTargetType()))));',
                  '        }',
                  '        return ResponseEntity.badRequest()',
                  '            .body(Map.of("error", messageOf(exception)));',
                  '    }',
                  '',
                  '    @ExceptionHandler(DataIntegrityViolationException.class)',
                  '    public ResponseEntity<Map<String, Object>> refused(',
                  '            DataIntegrityViolationException exception,',
                  '            HttpServletRequest request) {',
                  '        Map<String, Object> body = "DELETE".equals(request.getMethod())',
                  '            ? Map.of("errors", Map.of("id", "referenced"))',
                  '            : Map.of("error", messageOf(exception));',
                  '        return ResponseEntity.status(HttpStatus.CONFLICT).body(body);',
                  '    }',
                  '',
                  '    private static List<String> fieldsOf(Object payload) {',
                  '        if (payload == null || !payload.getClass().isRecord()) {',
                  '            return List.of();',
                  '        }',
                  '        return Stream.of(payload.getClass().getRecordComponents())',
                  '            .map(RecordComponent::getName)',
                  '            .toList();',
                  '    }',
                  '',
                  '    private static String reasonOf(FieldError error) {',
                  '        String code = error.getCode();',
                  '        return "NotNull".equals(code) || "NotEmpty".equals(code)',
                  '            ? "required"',
                  '            : String.valueOf(code);',
                  '    }',
                  '',
                  '    private static String kindOf(Class<?> type) {',
                  '        if (type == null) {',
                  '            return "type";',
                  '        }',
                  '        if (Temporal.class.isAssignableFrom(type)) {',
                  '            return "date";',
                  '        }',
                  '        if (Number.class.isAssignableFrom(type)) {',
                  '            return "Number";',
                  '        }',
                  '        return type.getSimpleName();',
                  '    }',
                  '',
                  '    private static String messageOf(Exception exception) {',
                  '        Throwable cause = NestedExceptionUtils.getMostSpecificCause(exception);',
                  '        return String.valueOf(cause.getMessage());',
                  '    }',
                  '}'
                ]
              }

              /** The lines of the application class. */
              function applicationClassOf(
                context: any,
                appClass: string
              ): string[] {
                return [
                  `package ${context.basePackage};`,
                  '',
                  'import org.springframework.boot.SpringApplication;',
                  'import org.springframework.boot.autoconfigure.SpringBootApplication;',
                  '',
                  '@SpringBootApplication',
                  `public class ${appClass} {`,
                  '',
                  '    public static void main(String[] args) {',
                  `        SpringApplication.run(${appClass}.class, args);`,
                  '    }',
                  '}'
                ]
              }

              /** The lines of `README.md`. */
              function readmeOf(pattern: any, context: any): string[] {
                const database = databaseOf(pattern, context)
                const title = context.application.title || context.application.name
                const resources: any[] = (context.beans ?? [])
                  .filter((bean: any) => bean.instanceOf?.name === 'Controller')
                  .map((controller: any) => controller.resource)
                  .filter((resource: any) => !!resource)
                return [
                  `# ${title} — Spring Boot`,
                  '',
                  `Generated from the Spring context \`${context.name}\` of the application`,
                  `\`${context.application.name}\`. Regenerated at each change of the model: edit the`,
                  'model, not these files.',
                  '',
                  '## Run',
                  '',
                  `1. A MariaDB server on \`localhost:3306\` with a database named`,
                  `   \`${database ? database.name : pattern.kebabOf(context.name)}\`; \`DB_USER\` and \`DB_PASSWORD\` name its credentials`,
                  '   (defaults: `root` and empty).',
                  '   The `docker-compose.yml` at the root of a Spring + Angular project',
                  '   starts one: `docker compose up -d`.',
                  '2. `mvn spring-boot:run` — the API listens on `http://localhost:8080`.',
                  '   A database just started may refuse the first connection: wait a',
                  '   few seconds and run it again.',
                  '',
                  '## Schema',
                  '',
                  'Spring creates the missing tables at start from',
                  '`src/main/resources/schema.sql`, then Hibernate checks that the',
                  'entities match them and changes nothing. After a field is added to',
                  'the model, the check fails until the database is created again',
                  '(`docker compose down` then `docker compose up -d`).',
                  '',
                  '## Resources',
                  '',
                  ...resources.map((resource: any) => `- \`${pattern.routeOf(resource)}\` — ${resource.name}`)
                ]
              }
      - name: EntityToJavaFile
        instanceOf: Core:Class
        icon: mui:TableChart
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:jpa.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:JavaFile
            code: |
              import { JavaFile } from 'FileSystem'

              /**
               * EntityToJavaFile — the JPA entity class of an entity (rule 18), in
               * `entity/` of the base package of its context: `@Entity` on its table
               * and an attribute per attribute of the model —
               * - a Field becomes a column of the Java type of its column, the one
               *   the entity names as `id` generated as `idGeneration` says;
               * - a ManyToOne becomes an association on the column of its foreign
               *   key, typed by the target entity;
               * - a column names its SQL type (`columnDefinition`), the one
               *   `schema.sql` creates: Hibernate validates the database against
               *   it (rule 14) — a `CHAR(36)` identifier is not the `varchar(255)`
               *   it would expect for a String;
               * - a OneToMany becomes a list mapped by the ManyToOne of the other
               *   entity.
               * Then an empty constructor and the accessors.
               */
              export default function (source) {
                const entity: any = source
                const className = this.pascalOf(entity.name)
                const attributes: any[] = entity.attributes ?? []
                const lines = [
                  `package ${entity.context.basePackage}.entity;`,
                  '',
                  ...importsOf(this, entity, attributes),
                  '@Entity',
                  `@Table(name = "${entity.table.name}")`,
                  `public class ${className} {`,
                  '',
                  ...attributes.flatMap((a: any) => [...attributeOf(this, entity, a), '']),
                  `    public ${className}() {`,
                  '    }',
                  ...attributes.flatMap((a: any) => ['', ...accessorsOf(this, entity, a)]),
                  '}'
                ]
                return new JavaFile({
                  name: this.fileNameOf(className, 'java'),
                  text: this.textOf(lines)
                })
              }

              /**
               * `Field`, `ManyToOne` or `OneToMany`: the class of an attribute.
               */
              function kindOf(attribute: any): string {
                return attribute.instanceOf?.name ?? ''
              }

              /** The Java type of an attribute. */
              function typeOf(
                pattern: any,
                entity: any,
                attribute: any
              ): string {
                const kind = kindOf(attribute)
                if (kind === 'ManyToOne') return pattern.pascalOf(attribute.target.name)
                if (kind === 'OneToMany') {
                  return `List<${pattern.pascalOf(attribute.mappedBy.entity.name)}>`
                }
                const column = attribute.column
                if (entity.id === attribute && entity.idGeneration === 'IDENTITY') {
                  return 'Long'
                }
                return pattern.javaTypeOf(column)
              }

              /**
               * `cascade = CascadeType.ALL` or `cascade = {…}` from the model.
               */
              function cascadeOf(attribute: any): string[] {
                const values: string[] = attribute.cascade ?? []
                if (values.length === 0) return []
                const items = values.map((v: string) => `CascadeType.${v}`)
                return [items.length === 1 ? `cascade = ${items[0]}` : `cascade = {${items.join(', ')}}`]
              }

              /** The annotations and the declaration of an attribute. */
              function attributeOf(
                pattern: any,
                entity: any,
                attribute: any
              ): string[] {
                const kind = kindOf(attribute)
                const name = pattern.camelOf(attribute.name)
                const type = typeOf(pattern, entity, attribute)
                if (kind === 'ManyToOne') {
                  const options = [
                    ...(attribute.fetch ? [`fetch = FetchType.${attribute.fetch}`] : []),
                    ...cascadeOf(attribute)
                  ]
                  const column = attribute.foreignKey?.column
                  const nullable = column && column.mandatory ? ', nullable = false' : ''
                  const definition = definitionOf(column)
                  return [
                    `    @ManyToOne${options.length ? `(${options.join(', ')})` : ''}`,
                    `    @JoinColumn(name = "${column?.name ?? name}"${nullable}${definition})`,
                    `    private ${type} ${name};`
                  ]
                }
                if (kind === 'OneToMany') {
                  const options = [
                    `mappedBy = "${pattern.camelOf(attribute.mappedBy.name)}"`,
                    ...(attribute.fetch ? [`fetch = FetchType.${attribute.fetch}`] : []),
                    ...cascadeOf(attribute),
                    ...(attribute.orphanRemoval ? ['orphanRemoval = true'] : [])
                  ]
                  return [
                    `    @OneToMany(${options.join(', ')})`,
                    `    private ${type} ${name} = new ArrayList<>();`
                  ]
                }
                const column = attribute.column
                const nullable = column?.mandatory ? ', nullable = false' : ''
                const definition = definitionOf(column)
                return [
                  ...(entity.id === attribute
                    ? ['    @Id', `    @GeneratedValue(strategy = GenerationType.${entity.idGeneration ?? 'UUID'})`]
                    : []),
                  ...(column?.multiple ? ['    @JdbcTypeCode(SqlTypes.JSON)'] : []),
                  `    @Column(name = "${column?.name ?? attribute.name}"${nullable}${definition})`,
                  `    private ${type} ${name};`
                ]
              }

              /**
               * The SQL type of a column as an option of its annotation, none when
               * the model gives no type. A `JSON` column is declared `LONGTEXT`:
               * MariaDB stores JSON as an alias of LONGTEXT and reports it so to
               * the validation of Hibernate.
               */
              function definitionOf(column: any): string {
                if (!column?.sqlType) return ''
                const type = /^json$/i.test(column.sqlType) ? 'LONGTEXT'
                  : column.sqlType
                return `, columnDefinition = "${type}"`
              }

              /** The getter and the setter of an attribute. */
              function accessorsOf(
                pattern: any,
                entity: any,
                attribute: any
              ): string[] {
                const name = pattern.camelOf(attribute.name)
                const type = typeOf(pattern, entity, attribute)
                const suffix = pattern.pascalOf(attribute.name)
                return [
                  `    public ${type} get${suffix}() {`,
                  `        return ${name};`,
                  '    }',
                  '',
                  `    public void set${suffix}(${type} ${name}) {`,
                  `        this.${name} = ${name};`,
                  '    }'
                ]
              }

              /**
               * The imports the attributes need, `jakarta.persistence.*` first.
               */
              function importsOf(
                pattern: any,
                entity: any,
                attributes: any[]
              ): string[] {
                const types = attributes.map((a: any) => typeOf(pattern, entity, a))
                const lists = types.some((t: string) => t.startsWith('List<'))
                const json = attributes.some((a: any) => kindOf(a) === 'Field' && a.column?.multiple)
                const imports = [
                  'jakarta.persistence.*',
                  ...(types.some((t: string) => t.includes('Instant')) ? ['java.time.Instant'] : []),
                  ...(lists ? ['java.util.ArrayList', 'java.util.List'] : []),
                  ...(json ? ['org.hibernate.annotations.JdbcTypeCode', 'org.hibernate.type.SqlTypes'] : [])
                ]
                return [...imports.map((i: string) => `import ${i};`), '']
              }
      - name: ControllerToDtos
        instanceOf: Core:Class
        icon: mui:DataObject
        extends:
          - ApplicationToCode:code.CodePattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:web.Controller
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: FileSystem:JavaFile
            code: |
              import { JavaFile } from 'FileSystem'

              /**
               * ControllerToDtos — a transfer record per payload the controller
               * serves (rule 19), in `dto/` of the base package of its context:
               * `<Payload>Dto`, a component per field of the payload, `@NotNull` on a
               * mandatory one. The request and the response of each endpoint the
               * controller lists, once each.
               */
              export default function (source) {
                const controller: any = source
                const basePackage = controller.context.basePackage
                return this.payloadsOf(controller)
                  .map((payload: any) => recordOf(this, basePackage, payload))
              }

              /**
               * The check of a mandatory field: `NotEmpty` for a String, as the
               * `required` of the Node server refuses an empty text, `NotNull`
               * otherwise; none for an optional field.
               */
              function checkOf(field: any, type: string): string {
                if (!field.mandatory) return ''
                return type === 'String' ? 'NotEmpty' : 'NotNull'
              }

              /** The record of a payload. */
              function recordOf(
                pattern: any,
                basePackage: string,
                payload: any
              ) {
                const name = `${pattern.pascalOf(payload.name)}Dto`
                const fields: any[] = payload.fields ?? []
                const types = fields.map((field: any) => pattern.javaTypeOf(field))
                const checks = fields.map((field: any, i: number) =>
                  checkOf(field, types[i]))
                const imports = [
                  ...(checks.includes('NotEmpty') ? ['jakarta.validation.constraints.NotEmpty'] : []),
                  ...(checks.includes('NotNull') ? ['jakarta.validation.constraints.NotNull'] : []),
                  ...(types.some((t: string) => t.includes('Instant')) ? ['java.time.Instant'] : []),
                  ...(types.some((t: string) => t.startsWith('List<')) ? ['java.util.List'] : [])
                ]
                const components = fields.map((field: any, i: number) => {
                  const check = checks[i] ? `@${checks[i]} ` : ''
                  const comma = i < fields.length - 1 ? ',' : ''
                  return `    ${check}${types[i]} ${pattern.camelOf(field.name)}${comma}`
                })
                const lines = [
                  `package ${basePackage}.dto;`,
                  '',
                  ...(imports.length ? [...imports.map((i: string) => `import ${i};`), ''] : []),
                  `public record ${name}(`,
                  ...components,
                  ') {',
                  '}'
                ]
                return new JavaFile({
                  name: pattern.fileNameOf(name, 'java'),
                  text: pattern.textOf(lines)
                })
              }
      - name: entityToJavaFile
        instanceOf: SpringAngularToCode:spring.EntityToJavaFile
        source: Spring:jpa.Entity
        target: FileSystem:Folder
        outputRelation: FileSystem:EntryContainer.entries
      - name: controllerToDtos
        instanceOf: SpringAngularToCode:spring.ControllerToDtos
        source: Spring:web.Controller
        target: FileSystem:Folder
        outputRelation: FileSystem:EntryContainer.entries
      - name: springToCode
        instanceOf: SpringAngularToCode:spring.ContextToProject
        source: Spring:boot.Context
        target: FileSystem:SystemFolder
        outputRelation: FileSystem:EntryContainer.entries
      - name: RepositoryToJavaFile
        instanceOf: Core:Class
        icon: mui:Storage
        extends:
          - SpringAngularToCode:spring.SpringPattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:jpa.Repository
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:JavaFile
            code: |
              import { JavaFile } from 'FileSystem'

              /**
               * RepositoryToJavaFile — the Spring Data interface of a repository
               * (rule 20), in `repository/` of the base package of its context:
               * `JpaRepository` of its entity, typed by the type of its key.
               */
              export default function (source) {
                const repository: any = source
                const entity = repository.entity
                if (!entity) {
                  throw new Error(`${repository.name}: the repository has no entity`)
                }
                const className = this.pascalOf(repository.name)
                const entityClass = this.pascalOf(entity.name)
                const basePackage = repository.context.basePackage
                const lines = [
                  `package ${basePackage}.repository;`,
                  '',
                  `import ${basePackage}.entity.${entityClass};`,
                  'import org.springframework.data.jpa.repository.JpaRepository;',
                  '',
                  `public interface ${className}`,
                  `        extends JpaRepository<${entityClass}, ${this.keyTypeOf(entity)}> {`,
                  '}'
                ]
                return new JavaFile({
                  name: this.fileNameOf(className, 'java'),
                  text: this.textOf(lines)
                })
              }
      - name: ServiceToJavaFile
        instanceOf: Core:Class
        icon: mui:SettingsSuggest
        extends:
          - SpringAngularToCode:spring.SpringPattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:service.Service
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:JavaFile
            code: |
              import { JavaFile } from 'FileSystem'

              /**
               * ServiceToJavaFile — the service class of a service bean (rules 21,
               * 23 and 12), in `service/` of the base package of its context:
               * `@Service`, `@Transactional` when the model says so, a final
               * attribute per repository, and a method per operation its
               * controllers serve, written with the repository of the entity of
               * the resource. The conversions between the entity and the transfer
               * records close the class.
               */
              export default function (source) {
                const service: any = source
                const className = this.pascalOf(service.name)
                const basePackage = service.context.basePackage
                const repositories: any[] = service.repositories ?? []
                const uses = new Set<string>()
                const methods: string[][] = []
                const conversions = new Map<string, string[]>()
                for (const controller of this.controllersOf(service)) {
                  const part = partOf(this, controller)
                  if (part.served.length) uses.add(part.entityImport)
                  for (const endpoint of part.served) {
                    methods.push(methodOf(this, part, endpoint, uses))
                  }
                  addConversions(this, part, conversions, uses)
                }
                for (const r of repositories) {
                  uses.add(`${basePackage}.repository.${this.pascalOf(r.name)}`)
                }
                const manager = uses.has('jakarta.persistence.EntityManager')
                const fields = [
                  ...repositories.map((r: any) =>
                    [this.pascalOf(r.name), this.camelOf(r.name)]),
                  ...(manager ? [['EntityManager', 'entityManager']] : [])
                ]
                const lines = [
                  `package ${basePackage}.service;`,
                  '',
                  ...importsOf(service, uses),
                  '@Service',
                  ...(service.transactional ? ['@Transactional'] : []),
                  `public class ${className} {`,
                  ...(fields.length ? [''] : []),
                  ...fields.map(([type, name]) => `    private final ${type} ${name};`),
                  ...constructorOf(className, fields),
                  ...methods.flatMap((method: string[]) => ['', ...method]),
                  ...[...conversions.values()].flatMap((c: string[]) => ['', ...c]),
                  '}'
                ]
                return new JavaFile({
                  name: this.fileNameOf(className, 'java'),
                  text: this.textOf(lines)
                })
              }

              /**
               * What the service does for one controller: the endpoints it
               * implements, the entity of the resource and its repository.
               */
              function partOf(pattern: any, controller: any): any {
                const repository = pattern.repositoryOf(controller)
                const entity = repository?.entity
                const basePackage = controller.context.basePackage
                return {
                  controller,
                  served: pattern.servedOf(controller),
                  entity,
                  entityClass: entity ? pattern.pascalOf(entity.name) : '',
                  keyType: entity ? pattern.keyTypeOf(entity) : 'String',
                  repository: repository ? pattern.camelOf(repository.name) : '',
                  entityImport: entity
                    ? `${basePackage}.entity.${pattern.pascalOf(entity.name)}`
                    : ''
                }
              }

              /** The name of the record of a payload. */
              function dtoOf(pattern: any, payload: any): string {
                return `${pattern.pascalOf(payload.name)}Dto`
              }

              /** The method of an operation (rule 21). */
              function methodOf(
                pattern: any,
                part: any,
                endpoint: any,
                uses: Set<string>
              ): string[] {
                const operation = pattern.operationOf(endpoint)
                const name = pattern.serviceMethodOf(part.controller, operation)
                const basePackage = part.controller.context.basePackage
                const out = endpoint.response ? dtoOf(pattern, endpoint.response) : ''
                const input = endpoint.request ? dtoOf(pattern, endpoint.request) : ''
                for (const dto of [out, input].filter((d: string) => d)) {
                  uses.add(`${basePackage}.dto.${dto}`)
                }
                const repo = part.repository
                const key = part.keyType
                if (operation === 'list') {
                  uses.add('java.util.List')
                  return [
                    `    public List<${out}> ${name}() {`,
                    `        return ${repo}.findAll().stream().map(this::to${out}).toList();`,
                    '    }'
                  ]
                }
                if (operation === 'get') {
                  uses.add('java.util.Optional')
                  return [
                    `    public Optional<${out}> ${name}(${key} id) {`,
                    `        return ${repo}.findById(id).map(this::to${out});`,
                    '    }'
                  ]
                }
                if (operation === 'create') {
                  return [
                    `    public ${out} ${name}(${input} input) {`,
                    `        ${part.entityClass} entity = new ${part.entityClass}();`,
                    `        apply${input}(entity, input);`,
                    `        return to${out}(${repo}.save(entity));`,
                    '    }'
                  ]
                }
                if (operation === 'update') {
                  uses.add('java.util.Optional')
                  return [
                    `    public Optional<${out}> ${name}(${key} id, ${input} input) {`,
                    `        return ${repo}.findById(id).map(entity -> {`,
                    `            apply${input}(entity, input);`,
                    `            return to${out}(${repo}.save(entity));`,
                    '        });',
                    '    }'
                  ]
                }
                return [
                  `    public boolean ${name}(${key} id) {`,
                  `        if (!${repo}.existsById(id)) {`,
                  '            return false;',
                  '        }',
                  `        ${repo}.deleteById(id);`,
                  '        return true;',
                  '    }'
                ]
              }

              /**
               * Adds the conversions the methods of a controller call, once each:
               * `to<Record>` from the entity for each response, `apply<Record>`
               * onto the entity for each request.
               */
              function addConversions(
                pattern: any,
                part: any,
                conversions: Map<string, string[]>,
                uses: Set<string>
              ): void {
                for (const endpoint of part.served) {
                  const response = endpoint.response
                  const request = endpoint.request
                  if (response && !conversions.has(`to${dtoOf(pattern, response)}`)) {
                    conversions.set(
                      `to${dtoOf(pattern, response)}`,
                      toDtoOf(pattern, part, response)
                    )
                  }
                  if (request && !conversions.has(`apply${dtoOf(pattern, request)}`)) {
                    conversions.set(
                      `apply${dtoOf(pattern, request)}`,
                      applyOf(pattern, part, request, uses)
                    )
                  }
                }
              }

              /**
               * The attribute of the entity a payload field matches (rule 12): the
               * Field or the ManyToOne of the same name, or the ManyToOne whose
               * foreign key is on the column named as the field (`clientId` gives
               * `client`). None: undefined.
               */
              function attributeOf(entity: any, field: any): any {
                const attributes: any[] = entity.attributes ?? []
                const kind = (a: any) => a.instanceOf?.name
                const same = attributes.find((a: any) => a.name === field.name)
                if (same && kind(same) !== 'OneToMany') return same
                return attributes.find((a: any) =>
                  kind(a) === 'ManyToOne' &&
                  a.foreignKey?.column?.name === field.name)
              }

              /**
               * A field without a matching attribute is left out with a TODO in
               * the code and a warning in the log (rule 12).
               */
              function unmatched(part: any, payload: any, field: any): string {
                log.warning(
                  `${part.controller.service.name}: ${payload.name}.${field.name} ` +
                  `matches no attribute of ${part.entity.name}`
                )
                return `TODO: ${field.name} matches no attribute of ${part.entity.name}`
              }

              /** `to<Record>`: the record of an entity. */
              function toDtoOf(
                pattern: any,
                part: any,
                payload: any
              ): string[] {
                const dto = dtoOf(pattern, payload)
                const fields: any[] = payload.fields ?? []
                const values = fields.map((field: any, i: number) => {
                  const comma = i < fields.length - 1 ? ',' : ''
                  const attribute = attributeOf(part.entity, field)
                  if (!attribute) {
                    return `            null${comma} // ${unmatched(part, payload, field)}`
                  }
                  const getter = `entity.get${pattern.pascalOf(attribute.name)}()`
                  if (attribute.instanceOf?.name !== 'ManyToOne') {
                    return `            ${getter}${comma}`
                  }
                  const keyName = attribute.target?.id?.name ?? 'id'
                  const key = `get${pattern.pascalOf(keyName)}()`
                  return `            ${getter} == null ? null : ${getter}.${key}${comma}`
                })
                return [
                  `    private ${dto} to${dto}(${part.entityClass} entity) {`,
                  `        return new ${dto}(`,
                  ...values,
                  '        );',
                  '    }'
                ]
              }

              /**
               * `apply<Record>`: the fields of a record set on the entity; a
               * ManyToOne receives a reference to the entity of the key it carries;
               * a multiple field left out is an empty list, as the Node server
               * stores it.
               */
              function applyOf(
                pattern: any,
                part: any,
                payload: any,
                uses: Set<string>
              ): string[] {
                const dto = dtoOf(pattern, payload)
                const basePackage = part.controller.context.basePackage
                const fields: any[] = payload.fields ?? []
                const statements = fields.flatMap((field: any) => {
                  const attribute = attributeOf(part.entity, field)
                  if (!attribute) return [`        // ${unmatched(part, payload, field)}`]
                  if (attribute === part.entity.id) return []
                  const setter = `entity.set${pattern.pascalOf(attribute.name)}`
                  const value = `input.${pattern.camelOf(field.name)}()`
                  if (attribute.instanceOf?.name !== 'ManyToOne') {
                    if (!field.multiple) return [`        ${setter}(${value});`]
                    uses.add('java.util.ArrayList')
                    return [
                      `        ${setter}(${value} == null ? new ArrayList<>()`,
                      `            : ${value});`
                    ]
                  }
                  const target = pattern.pascalOf(attribute.target.name)
                  uses.add(`${basePackage}.entity.${target}`)
                  uses.add('jakarta.persistence.EntityManager')
                  return [
                    `        ${setter}(${value} == null ? null`,
                    `            : entityManager.getReference(${target}.class, ${value}));`
                  ]
                })
                return [
                  `    private void apply${dto}(${part.entityClass} entity, ${dto} input) {`,
                  ...statements,
                  '    }'
                ]
              }

              /** The constructor that receives the final attributes. */
              function constructorOf(
                className: string,
                fields: string[][]
              ): string[] {
                if (fields.length === 0) return []
                const params = fields.map(([type, name], i: number) =>
                  `            ${type} ${name}${i < fields.length - 1 ? ',' : ''}`)
                return [
                  '',
                  `    public ${className}(`,
                  ...params,
                  '    ) {',
                  ...fields.map(([, name]) => `        this.${name} = ${name};`),
                  '    }'
                ]
              }

              /** The imports, sorted, then a blank line. */
              function importsOf(service: any, uses: Set<string>): string[] {
                const all = [
                  ...uses,
                  'org.springframework.stereotype.Service',
                  ...(service.transactional
                    ? ['org.springframework.transaction.annotation.Transactional']
                    : [])
                ].filter((i: string) => i)
                const sorted = [...new Set(all)].sort()
                return [...sorted.map((i: string) => `import ${i};`), '']
              }
      - name: ControllerToJavaFile
        instanceOf: Core:Class
        icon: mui:Http
        extends:
          - SpringAngularToCode:spring.SpringPattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Spring:web.Controller
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: FileSystem:JavaFile
            code: |
              import { JavaFile } from 'FileSystem'

              /**
               * ControllerToJavaFile — the REST controller of a controller bean
               * (rules 22 and 10), in `web/` of the base package of its context:
               * `@RestController` on the route of its resource, and a method per
               * endpoint it serves, which calls its service. An endpoint the
               * service does not implement — an operation the pattern does not
               * know, a missing payload, no repository for the resource — answers
               * 501 and the log says why.
               */
              export default function (source) {
                const controller: any = source
                const resource = controller.resource
                if (!resource) {
                  throw new Error(`${controller.name}: the controller has no resource`)
                }
                if ((resource.payloads ?? []).length === 0) {
                  throw new Error(`${controller.name}: ${resource.name} has no payload`)
                }
                const className = this.pascalOf(controller.name)
                const basePackage = controller.context.basePackage
                const served: any[] = this.servedOf(controller)
                const service = controller.service
                warnUnserved(this, controller, served)
                const uses = new Set<string>()
                const handlers = (controller.endpoints ?? []).map((endpoint: any) =>
                  handlerOf(this, controller, served, endpoint, uses))
                if (service) {
                  uses.add(`${basePackage}.service.${this.pascalOf(service.name)}`)
                }
                const fields = service
                  ? [[this.pascalOf(service.name), this.camelOf(service.name)]]
                  : []
                const lines = [
                  `package ${basePackage}.web;`,
                  '',
                  ...importsOf(uses),
                  '@RestController',
                  `@RequestMapping("${this.routeOf(resource)}")`,
                  `public class ${className} {`,
                  ...fields.flatMap(([type, name]) => [
                    '',
                    `    private final ${type} ${name};`,
                    '',
                    `    public ${className}(${type} ${name}) {`,
                    `        this.${name} = ${name};`,
                    '    }'
                  ]),
                  ...handlers.flatMap((handler: string[]) => ['', ...handler]),
                  '}'
                ]
                return new JavaFile({
                  name: this.fileNameOf(className, 'java'),
                  text: this.textOf(lines)
                })
              }

              /**
               * The log says once why the service implements none of the
               * endpoints: no service, or no repository for the resource.
               */
              function warnUnserved(
                pattern: any,
                controller: any,
                served: any[]
              ): void {
                if ((controller.endpoints ?? []).length === 0 || served.length) return
                if (!controller.service) {
                  log.warning(`${controller.name}: no service, every endpoint answers 501`)
                } else if (!pattern.repositoryOf(controller)) {
                  log.warning(
                    `${controller.name}: ${controller.service.name} has no repository ` +
                    `for ${controller.resource.name}, every endpoint answers 501`
                  )
                }
              }

              /** The mapping of an endpoint: its relative path as is. */
              function mappingOf(endpoint: any): string {
                const method = String(endpoint.method ?? 'GET').toLowerCase()
                const verb = method.charAt(0).toUpperCase() + method.slice(1)
                const path = String(endpoint.path ?? '')
                return `    @${verb}Mapping${path ? `("${path}")` : ''}`
              }

              /** `@PathVariable("id") String id` for a path `/{id}`. */
              function idParamOf(endpoint: any, keyType: string): string {
                const match = /\{([^}]+)\}/.exec(String(endpoint.path ?? ''))
                const variable = match ? match[1] : 'id'
                return `@PathVariable("${variable}") ${keyType} id`
              }

              /** The method of an endpoint. */
              function handlerOf(
                pattern: any,
                controller: any,
                served: any[],
                endpoint: any,
                uses: Set<string>
              ): string[] {
                const operation = pattern.operationOf(endpoint)
                const implemented = served
                  .find((e: any) => pattern.operationOf(e) === operation)
                const name = pattern.camelOf(endpoint.name)
                if (!implemented) {
                  return notImplementedOf(pattern, controller, endpoint, name, uses)
                }
                const basePackage = controller.context.basePackage
                const dto = (payload: any) => `${pattern.pascalOf(payload.name)}Dto`
                const out = implemented.response ? dto(implemented.response) : ''
                const input = implemented.request ? dto(implemented.request) : ''
                for (const d of [out, input].filter((d: string) => d)) {
                  uses.add(`${basePackage}.dto.${d}`)
                }
                const service = pattern.camelOf(controller.service.name)
                const call = `${service}.${pattern.serviceMethodOf(controller, operation)}`
                const entity = pattern.repositoryOf(controller).entity
                const id = idParamOf(endpoint, pattern.keyTypeOf(entity))
                const body = `@RequestBody @Valid ${input} input`
                const mapping = mappingOf(endpoint)
                if (operation === 'list') {
                  uses.add('java.util.List')
                  return [
                    mapping,
                    `    public List<${out}> ${name}() {`,
                    `        return ${call}();`,
                    '    }'
                  ]
                }
                uses.add('org.springframework.http.ResponseEntity')
                if (operation === 'get') {
                  return [
                    mapping,
                    `    public ResponseEntity<${out}> ${name}(${id}) {`,
                    `        return ResponseEntity.of(${call}(id));`,
                    '    }'
                  ]
                }
                if (operation === 'create') {
                  uses.add('jakarta.validation.Valid')
                  uses.add('org.springframework.http.HttpStatus')
                  return [
                    mapping,
                    `    public ResponseEntity<${out}> ${name}(${body}) {`,
                    '        return ResponseEntity.status(HttpStatus.CREATED)',
                    `            .body(${call}(input));`,
                    '    }'
                  ]
                }
                if (operation === 'update') {
                  uses.add('jakarta.validation.Valid')
                  return [
                    mapping,
                    `    public ResponseEntity<${out}> ${name}(`,
                    `            ${id},`,
                    `            ${body}) {`,
                    `        return ResponseEntity.of(${call}(id, input));`,
                    '    }'
                  ]
                }
                return [
                  mapping,
                  `    public ResponseEntity<Void> ${name}(${id}) {`,
                  `        return ${call}(id)`,
                  '            ? ResponseEntity.noContent().build()',
                  '            : ResponseEntity.notFound().build();',
                  '    }'
                ]
              }

              /**
               * The method of an endpoint the service does not implement: it
               * answers 501 (rule 10). An unknown operation or a missing payload
               * is said in the log.
               */
              function notImplementedOf(
                pattern: any,
                controller: any,
                endpoint: any,
                name: string,
                uses: Set<string>
              ): string[] {
                const operation = pattern.operationOf(endpoint)
                const route = `${endpoint.method} ${endpoint.path ?? ''}`.trim()
                const why = operation === 'unknown'
                  ? 'is no operation the pattern knows'
                  : 'has no implementation in the service'
                if (operation === 'unknown') {
                  log.warning(`${controller.name}: ${route} ${why}, it answers 501`)
                } else if (pattern.repositoryOf(controller)) {
                  log.warning(
                    `${controller.name}: ${endpoint.name} lacks the payload ` +
                    `its operation needs, it answers 501`
                  )
                }
                uses.add('org.springframework.http.HttpStatus')
                uses.add('org.springframework.http.ResponseEntity')
                return [
                  mappingOf(endpoint),
                  `    public ResponseEntity<Void> ${name}() {`,
                  `        // TODO: ${route} ${why}`,
                  '        return ResponseEntity.status(HttpStatus.NOT_IMPLEMENTED).build();',
                  '    }'
                ]
              }

              /** The imports, sorted, then a blank line. */
              function importsOf(uses: Set<string>): string[] {
                const all = [...uses, 'org.springframework.web.bind.annotation.*']
                const sorted = [...new Set(all)].sort()
                return [...sorted.map((i: string) => `import ${i};`), '']
              }
      - name: repositoryToJavaFile
        instanceOf: SpringAngularToCode:spring.RepositoryToJavaFile
        source: Spring:jpa.Repository
        target: FileSystem:Folder
        outputRelation: FileSystem:EntryContainer.entries
      - name: serviceToJavaFile
        instanceOf: SpringAngularToCode:spring.ServiceToJavaFile
        source: Spring:service.Service
        target: FileSystem:Folder
        outputRelation: FileSystem:EntryContainer.entries
